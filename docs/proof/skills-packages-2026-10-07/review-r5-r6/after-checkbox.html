<style>label.checkbox-control {
  display: inline-grid;
  place-items: center;
  position: relative;
  width: 20px;
  height: 20px;
}

label.checkbox-control::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%; /* physical centering: direction-independent */
  transform: translate(-50%, -50%);
  width: 44px;
  height: 44px;
}
</style><label class="checkbox-control">
