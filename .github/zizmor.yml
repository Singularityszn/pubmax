# zizmor policy for pubmax workflows.
#
# Every remote action is pinned to a full commit SHA with its tag in a comment
# (zizmor's default hash-pin policy), and Dependabot's github-actions updater
# moves the pins. Every checkout sets `persist-credentials: false`.
rules:
  # GitHub's `$/` self-repository syntax stays remapped until a hosted run
  # shows it resolves. Keep `./`.
  self-repository:
    remap:
      severity: informational
  # alert-on-failure.yml is the one workflow_run workflow. The trigger is unsafe
  # when the run checks out or executes code from the triggering workflow, and
  # this one has no checkout and no repository code: it posts a link through
  # curl with the secret held in the environment. It exists so the pull request
  # workflows it watches need no secrets context.
  dangerous-triggers:
    ignore:
      - alert-on-failure.yml
