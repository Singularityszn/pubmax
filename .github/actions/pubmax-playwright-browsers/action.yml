name: PubMax Playwright browsers
description: Restore the job-local Playwright browser cache.
outputs:
  cache-hit:
    description: Whether the browser cache matched the exact key.
    value: ${{ steps.browser-restore.outputs.cache-hit || steps.browser-main.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${PLAYWRIGHT_BROWSERS_PATH:-}" != "$GITHUB_WORKSPACE/.ci-job-cache/ms-playwright" ]]; then
          echo "::error::Run pubmax-job-local-caches first."
          exit 1
        fi
        echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright-core"].version')" >> "$GITHUB_OUTPUT"
    - name: Restore Playwright browsers
      id: browser-restore
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-job-cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-${{ hashFiles('package-lock.json') }}
    - name: Restore and save Playwright browsers on main
      id: browser-main
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-job-cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}-${{ hashFiles('package-lock.json') }}
