name: PostgreSQL 16 PATH (pubmax-mac)
description: Expose Homebrew postgresql@16 and PostgREST on PATH for effective RLS proofs.
runs:
  using: composite
  steps:
    - name: Add PostgreSQL 16 and PostgREST to PATH
      shell: bash
      run: |
        set -euo pipefail
        PG_BIN="/opt/homebrew/opt/postgresql@16/bin"
        if [[ ! -x "$PG_BIN/postgres" ]]; then
          echo "Runner needs: brew install postgresql@16" >&2
          exit 1
        fi
        echo "$PG_BIN" >> "$GITHUB_PATH"
        if [[ ! -x /opt/homebrew/bin/postgrest ]]; then
          echo "Runner needs: brew install postgrest" >&2
          exit 1
        fi
        echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        export PATH="$PG_BIN:/opt/homebrew/bin:$PATH"
        initdb --version
        postgres --version
        psql --version
        postgrest --version
