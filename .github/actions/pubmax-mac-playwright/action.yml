name: Install Playwright Chromium (pubmax-mac)
description: Cache and install Chromium on the self-hosted macOS ARM64 runner.
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/ms-playwright
        # v2: Playwright routes chromium through chrome-headless-shell; stale caches
        # that only held full Chromium made law pins fail to launch browsers.
        key: playwright-browsers-macos-v2-${{ hashFiles('package-lock.json') }}

    - name: Install Chromium
      shell: bash
      run: npx playwright install chromium
