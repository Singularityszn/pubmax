name: PubMax Playwright port
description: >-
  Export PW_PORT for Playwright webServers. Uses the runner environment when
  set (for example PW_PORT=3200 in a second runner's .env); otherwise derives a
  stable port from RUNNER_NAME in one of 90 buckets (3100-3990, step 10). Two
  runner names can still hash to the same bucket, so pin PW_PORT per runner.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RUNNER_NAME: ${{ runner.name }}
      # The port is either the runner's own PW_PORT, refused unless it is a
      # plain port number, or computed below, so GITHUB_ENV only ever receives
      # PW_PORT=<digits>.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        if [ -n "${PW_PORT:-}" ]; then
          if ! [[ "$PW_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "PW_PORT from the runner environment is not a port number" >&2
            exit 1
          fi
          echo "PW_PORT=${PW_PORT}" >> "$GITHUB_ENV"
          echo "Playwright port ${PW_PORT} (from runner environment)"
          exit 0
        fi
        sum=$(printf '%s' "${RUNNER_NAME}" | cksum | awk '{print $1}')
        offset=$(( sum % 90 ))
        port=$((3100 + offset * 10))
        echo "PW_PORT=${port}" >> "$GITHUB_ENV"
        echo "Playwright port ${port} (derived from runner ${RUNNER_NAME})"
