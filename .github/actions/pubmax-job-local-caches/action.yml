name: PubMax job-local caches
description: Restore npm into a clean, job-local workspace cache.
outputs:
  npm-hit:
    description: Whether the npm cache matched the exact key.
    value: ${{ steps.npm-restore.outputs.cache-hit || steps.npm-main.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - shell: bash
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        rm -rf -- "$GITHUB_WORKSPACE/.ci-job-cache"
        mkdir -p "$GITHUB_WORKSPACE/.ci-job-cache"
        echo "npm_config_cache=$GITHUB_WORKSPACE/.ci-job-cache/npm" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.ci-job-cache/ms-playwright" >> "$GITHUB_ENV"
    - name: Restore npm cache
      id: npm-restore
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-job-cache/npm
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - name: Restore and save npm cache on main
      id: npm-main
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-job-cache/npm
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
