# Keep npm dependencies and pinned actions patched. Security hardening plan
# Phase 6.3. A release waits seven days before Dependabot proposes it, so a
# compromised version is more likely to be pulled before it reaches a branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    ignore:
      # Keep the coordinated OpenTelemetry API/SDK upgrade on hold:
      # @vercel/otel accepts API 1.10, but its logs and instrumentation peers
      # still require versions below 0.300. Remove these entries when those
      # peer ranges accept the 0.300 SDK line.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-proto"
        versions: [">=0.300.0"]
    groups:
      # The test-only @elevenlabs/client pin must equal the exact client that
      # @elevenlabs/react depends on, or the voice SDK tests see two copies.
      # Dependabot puts a package in the first group it matches.
      elevenlabs:
        patterns:
          - "@elevenlabs/*"
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
