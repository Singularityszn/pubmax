# Effective RLS session tests against real PostgreSQL 16 and PostgREST 14.
#
# The main `npm run ci` gate skips these tests loudly when local database
# binaries are absent. This job proves policies on pushes, pull requests and merge groups.
name: RLS session tests

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests the exact commit that will land on main
  # (docs/CI_RUNBOOK.md, "The required checks and the merge queue").
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a newer head cancels that pull request's
  # older run. Every other run (main push, schedule, dispatch) gets a
  # group of its own, so GitHub never drops it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # docs/CI_RUNBOOK.md owns the merge queue proof policy and its exceptions.
  queue-proof:
    name: Merge queue proof
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.proof.outputs.passed }}
    steps:
      - name: Find a green merge queue run of this workflow for this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path="${WORKFLOW_REF#"$REPO/"}"
          path="${path%%@*}"
          passed=false
          if runs="$(gh api "repos/$REPO/actions/runs?event=merge_group&status=success&head_sha=$SHA&per_page=100")" &&
            count="$(jq --arg path "$path" '[.workflow_runs[] | select(.path == $path)] | length' <<< "$runs")"; then
            if [ "$count" -gt 0 ]; then passed=true; fi
          else
            echo "::warning::Could not read the merge queue runs for $SHA, so every job runs."
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "Merge queue proof for $path at $SHA: $passed"

  rls-session:
    name: Effective RLS (Postgres 16 + PostgREST 14)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    # ubuntu-26.04 has no postgresql-16 package. LINUX_PINNED_JOBS in
    # __tests__/ciRunnerIsolation.test.ts owns this pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts

      # The harness starts its own cluster with initdb, so it needs the
      # PostgreSQL 16 binaries, not a service container.
      - name: Install PostgreSQL 16
        if: steps.scope.outputs.scope == 'code'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          initdb --version
          postgres --version
          psql --version

      - name: Restore the pinned PostgREST download
        if: steps.scope.outputs.scope == 'code'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pubmax-tools/postgrest-14.16-36b8ae140f188cfcd6003494805bf35a41e895f88c12be9183d60f91782145c6
          key: pubmax-tool-postgrest-14.16-36b8ae140f188cfcd6003494805bf35a41e895f88c12be9183d60f91782145c6

      - name: Install PostgREST 14
        if: steps.scope.outputs.scope == 'code'
        env:
          TOOL_NAME: postgrest
          TOOL_VERSION: '14.16'
          TOOL_URL: https://github.com/PostgREST/postgrest/releases/download/v14.16/postgrest-v14.16-linux-static-x86-64.tar.xz
          TOOL_SHA256: 36b8ae140f188cfcd6003494805bf35a41e895f88c12be9183d60f91782145c6
          TOOL_ARCHIVE: tar.xz
          TOOL_FALLBACK: docker
          TOOL_IMAGE: postgrest/postgrest@sha256:bea1c76a856fa39d1e542d25911cf95d02fe2bf971992d033044ff209f1504b8
          TOOL_IMAGE_PATH: /bin/postgrest
          TOOL_BINARY_SHA256: 9d363ab48d45a2d02d8ab82f8e9c6b541eca87c86be76bad5a3ff090ae03f3cc
        run: |
          scripts/ci/install-pinned-tool.sh
          postgrest --version

      - name: Run effective RLS session tests
        if: steps.scope.outputs.scope == 'code'
        run: npm run test:rls
        env:
          # Fail the job if any test is unexpectedly skipped (binaries present).
          # Vitest still reports intentional skips only when binaries are missing;
          # with postgresql-16 on PATH they must all run and pass.
          CI: true

  check:
    name: RLS session check
    if: ${{ always() }}
    needs: [queue-proof, rls-session]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          red="$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$red" ]; then
            echo "::error::Not green: $red"
            exit 1
          fi
