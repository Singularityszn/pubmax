# Effective RLS session tests against real PostgreSQL 16 and PostgREST 14.
#
# The main `npm run ci` gate (Vercel) skips these tests loudly when
# initdb/postgres/psql are absent — a skip is not a pass. This job is the
# place they run for real on every push and pull request.
name: RLS session tests

on:
  push:
    branches: [main, "fm/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-session:
    name: Effective RLS (Postgres 16 + PostgREST 14)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres 16 service: health-gated so steps only start when ready.
    # The harness also uses local initdb from postgresql-16 for an ephemeral
    # cluster; the service pins the CI environment to Postgres 16.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 16 and PostgREST 14
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v14.16/postgrest-v14.16-linux-static-x86-64.tar.xz
          echo "36b8ae140f188cfcd6003494805bf35a41e895f88c12be9183d60f91782145c6  $RUNNER_TEMP/postgrest.tar.xz" \
            | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/postgrest.tar.xz" --directory "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/postgrest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          initdb --version
          postgres --version
          psql --version
          "$RUNNER_TEMP/postgrest" --version

      - name: Run effective RLS session tests
        run: npm run test:rls
        env:
          # Fail the job if any test is unexpectedly skipped (binaries present).
          # Vitest still reports intentional skips only when binaries are missing;
          # with postgresql-16 on PATH they must all run and pass.
          CI: true
