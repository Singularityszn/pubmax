# Effective RLS session tests against real PostgreSQL 16 and PostgREST 14.
#
# The main `npm run ci` gate skips these tests loudly when local database
# binaries are absent. This job is configured for push and pull-request proof,
# but local proof remains required when GitHub cannot allocate a runner.
name: RLS session tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One self-hosted Mac shares a single _work checkout; parallel jobs stomp
  # the tree (validate-data temp collisions, build:slim vs Playwright guard).
  group: pubmax-mac-${{ github.repository }}
  cancel-in-progress: false


jobs:
  rls-session:
    name: Effective RLS (Postgres 16 + PostgREST 14)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS runners cannot use `services:` containers; Homebrew
      # postgresql@16 + postgrest on the runner host back the session harness
      # (scripts/rls/run-session-tests.mjs, scripts/rls/postgresHost.mjs).
      - name: Ensure PostgreSQL 16 and PostgREST 14 on PATH
        uses: ./.github/actions/pubmax-mac-postgres-path

      - name: Run effective RLS session tests
        run: npm run test:rls
        env:
          # Fail the job if any test is unexpectedly skipped (binaries present).
          # Vitest still reports intentional skips only when binaries are missing;
          # with postgresql-16 on PATH they must all run and pass.
          CI: true
