# Effective RLS session tests against real PostgreSQL 16 and PostgREST 14.
#
# The main `npm run ci` gate skips these tests loudly when local database
# binaries are absent. This job is the push and pull-request proof.
name: RLS session tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer pull request head supersedes older runs of this workflow.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  rls-session:
    name: Effective RLS (Postgres 16 + PostgREST 14)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts

      # The harness starts its own cluster with initdb, so it needs the
      # PostgreSQL 16 binaries, not a service container. PostgREST 14 is the
      # HTTP boundary. Both land on PATH for the test step.
      - name: Install PostgreSQL 16 and PostgREST 14
        if: steps.scope.outputs.scope == 'code'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v14.16/postgrest-v14.16-linux-static-x86-64.tar.xz
          echo "36b8ae140f188cfcd6003494805bf35a41e895f88c12be9183d60f91782145c6  $RUNNER_TEMP/postgrest.tar.xz" \
            | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/postgrest.tar.xz" --directory "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/postgrest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP:$PATH"
          initdb --version
          postgres --version
          psql --version
          "$RUNNER_TEMP/postgrest" --version

      - name: Run effective RLS session tests
        if: steps.scope.outputs.scope == 'code'
        run: npm run test:rls
        env:
          # Fail the job if any test is unexpectedly skipped (binaries present).
          # Vitest still reports intentional skips only when binaries are missing;
          # with postgresql-16 on PATH they must all run and pass.
          CI: true
