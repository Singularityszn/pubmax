name: Browser tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  law-pins:
    name: Browser law pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run law-pinning journeys
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_E2E_KEYLESS: "1"
          PW_SKIP_KEYLESS_WEBSERVER: "1"
          # The gate below judges the RUN, so the run has to write a report.
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-law-pins.json"
        run: >-
          npx playwright test
          --reporter=list,json
          e2e/smoke.spec.ts
          e2e/admin-document-guard.spec.ts
          e2e/account-switch-identity.spec.ts
          e2e/plan-capability-recovery.spec.ts
          e2e/plan-held-acceptance.spec.ts
          e2e/map-surface-history.spec.ts
          e2e/surface-back-and-home.spec.ts
          e2e/mobile-map-chrome-fit.spec.ts
          e2e/visit-reports.spec.ts
          e2e/landing-find-my-pint.spec.ts
          e2e/out-tab.spec.ts
          --project=chromium
          --workers=1

      # A skipped browser test is a lane nobody proved, so the law pins are held
      # to zero skips. scripts/assert-no-conditional-e2e-skips.mjs refuses one in
      # the source; this refuses one at run time.
      - name: Gate the law-pinning run
        run: node scripts/assert-playwright-gate.mjs playwright-law-pins.json --require-zero-skipped

  full-suite:
    name: Full browser suite (${{ matrix.suite }}, ${{ matrix.shard }}/4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [default, flag-on]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser shard
        if: matrix.suite == 'default'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_E2E_KEYLESS: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-default-${{ matrix.shard }}.json"
        run: >-
          npx playwright test
          --reporter=list,json
          --project=chromium
          --project=chromium-keyless
          --project=chromium-gl
          --project=chromium-sw-gl
          --project=chromium-no-gl
          --shard=${{ matrix.shard }}/4

      - name: Gate the full browser shard
        if: matrix.suite == 'default'
        run: node scripts/assert-playwright-gate.mjs playwright-default-${{ matrix.shard }}.json

      - name: Run flag-on browser shard
        if: matrix.suite == 'flag-on'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_E2E_KEYLESS: "1"
          PUBMAX_MAP_ROUTE_TRANSFER: "1"
          PUBMAX_PAL_HANDOFF: "1"
          PUBMAX_TONIGHT_GROUPING: "1"
          PUBMAX_SOCIAL_FRIENDS_LAUNCH: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-flag-on-${{ matrix.shard }}.json"
        run: >-
          npx playwright test
          --reporter=list,json
          --project=chromium-flag-on
          --shard=${{ matrix.shard }}/4

      - name: Gate the flag-on browser shard
        if: matrix.suite == 'flag-on'
        run: node scripts/assert-playwright-gate.mjs playwright-flag-on-${{ matrix.shard }}.json
