name: Browser tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer pull request head supersedes older runs of this workflow.
  # Main, nightly and dispatch runs finish.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  law-pins:
    name: Browser law pins
    # Law pins were proved on macOS font metrics. Ubuntu wraps the landing
    # hero one line further, so this job stays on macos-latest.
    runs-on: macos-latest
    timeout-minutes: 46
    # Each hosted runner is its own machine, so browser jobs are not queued
    # behind one another. One worker stays: four killed the single production
    # server, and that cap is what the law pins were proved with.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Choose Playwright port
        uses: ./.github/actions/pubmax-playwright-port

      # One worker. Four killed the single production server on this rig, and
      # on 3-4 Oct 2026 this cap is what passed once the machine was quiet.
      - name: Run law-pinning journeys
        env:
          PUBMAX_TRACKED_OUTPUTS: public/data
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_E2E_KEYLESS: "1"
          PW_SKIP_KEYLESS_WEBSERVER: "1"
          # The gate below judges the RUN, so the run has to write a report.
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-law-pins.json"
        run: >-
          npx playwright test
          --reporter=list,json
          e2e/smoke.spec.ts
          e2e/admin-document-guard.spec.ts
          e2e/account-switch-identity.spec.ts
          e2e/plan-capability-recovery.spec.ts
          e2e/plan-held-acceptance.spec.ts
          e2e/map-surface-history.spec.ts
          e2e/surface-back-and-home.spec.ts
          e2e/mobile-map-chrome-fit.spec.ts
          e2e/visit-reports.spec.ts
          e2e/landing-find-my-pint.spec.ts
          e2e/out-tab.spec.ts
          --project=chromium
          --workers=1

      # A skipped browser test is a lane nobody proved, so the law pins are held
      # to zero UNARGUED skips. scripts/assert-no-conditional-e2e-skips.mjs
      # refuses one in the source; this refuses one at run time, and both read
      # the same argued list, which may only shrink. Without the list this step
      # refused e2e/plan-capability-recovery.spec.ts's one argued skip (no
      # service-role key in the keyless server, #1300) and took its signed-out
      # proof down with it.
      - name: Gate the law-pinning run
        run: >-
          node scripts/assert-playwright-gate.mjs playwright-law-pins.json
          --require-zero-skipped
          --skips-argued e2e/conditional-skips.allowlist.json

  full-suite:
    name: Full browser suite (${{ matrix.shard }}/4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    # A hosted macOS runner gives Playwright one worker. Two shards of about
    # 645 tests each did not finish inside the 45-minute ceiling (4 Oct 2026
    # nightly and dispatch), so the suite is cut into four instead.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Choose Playwright port
        uses: ./.github/actions/pubmax-playwright-port

      - name: Run full browser shard
        env:
          PUBMAX_TRACKED_OUTPUTS: public/data
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_E2E_KEYLESS: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-default-${{ matrix.shard }}.json"
        run: >-
          npx playwright test
          --reporter=list,json
          --project=chromium
          --project=chromium-keyless
          --project=chromium-gl
          --project=chromium-sw-gl
          --project=chromium-no-gl
          --shard=${{ matrix.shard }}/4

      - name: Gate the full browser shard
        run: node scripts/assert-playwright-gate.mjs playwright-default-${{ matrix.shard }}.json
