name: Browser tests

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  law-pins:
    name: Browser law pins
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run law-pinning journeys
        env:
          PUBMAX_E2E_KEYLESS: "1"
        run: >-
          npx playwright test
          e2e/smoke.spec.ts
          e2e/admin-document-guard.spec.ts
          e2e/account-switch-identity.spec.ts
          e2e/plan-held-acceptance.spec.ts
          e2e/map-surface-history.spec.ts
          e2e/surface-back-and-home.spec.ts
          e2e/mobile-map-chrome-fit.spec.ts
          e2e/visit-reports.spec.ts
          e2e/landing-find-my-pint.spec.ts
          e2e/out-tab.spec.ts
          --project=chromium
          --workers=2

  full-suite:
    name: Full browser suite (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser shard
        env:
          PUBMAX_E2E_KEYLESS: "1"
        run: npx playwright test --shard=${{ matrix.shard }}/4
