name: Browser tests

on:
  pull_request:
    # labeled lets the layout-pins label start the macOS layout pins on a
    # pull request (docs/CI_RUNBOOK.md, "The required checks and the merge
    # queue"). Other labels skip every job without cancelling active checks.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue tests the exact commit that will land on main
  # (docs/CI_RUNBOOK.md, "The required checks and the merge queue").
  merge_group:
  push:
    branches: [main]
  # The nightly full suite has no `schedule`: GitHub started it hours late, in
  # the working day. A launchd timer on the Mac Studio dispatches it on main
  # at a quiet hour (docs/CI_RUNBOOK.md, "The nightly full suite").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a newer head or layout-pins label cancels that
  # pull request's older run. Main pushes share one group (captain, 19 Oct
  # 2026): the run in progress finishes, and only the newest push waits
  # behind it, because GitHub keeps one waiting run per group and cancels the
  # older one. The newest main commit holds every older one, so main is
  # still tested.
  # A dispatch gets a group of its own, so GitHub never drops one while it
  # waits. Other labels get separate, non-cancelling runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'main-push' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'layout-pins') }}


jobs:
  # docs/CI_RUNBOOK.md owns the merge queue proof policy and its exceptions.
  queue-proof:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Merge queue proof
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.proof.outputs.passed }}
    steps:
      - name: Find a green merge queue run of this workflow for this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path="${WORKFLOW_REF#"$REPO/"}"
          path="${path%%@*}"
          passed=false
          if runs="$(gh api "repos/$REPO/actions/runs?event=merge_group&status=success&head_sha=$SHA&per_page=100")" &&
            count="$(jq --arg path "$path" '[.workflow_runs[] | select(.path == $path)] | length' <<< "$runs")"; then
            if [ "$count" -gt 0 ]; then passed=true; fi
          else
            echo "::warning::Could not read the merge queue runs for $SHA, so every job runs."
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "Merge queue proof for $path at $SHA: $passed"

  law-pins:
    needs: [queue-proof]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Browser law pins
    # docs/CI_RUNBOOK.md owns runner selection and queue policy.
    # These journeys passed on Linux (16 Oct 2026). The one law pin that
    # measures phone chrome geometry, e2e/mobile-map-chrome-fit.spec.ts, lost
    # 7px at 320px to Linux glyph widths, so it runs with the layout pins.
    runs-on: ubuntu-latest
    timeout-minutes: 46
    # Each hosted runner is its own machine, so browser jobs are not queued
    # behind one another. One worker stays: four killed the single production
    # server, and that cap is what the law pins were proved with.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts

      # The hosted runner's apt mirror list starts with an Azure Ubuntu mirror.
      # When a mirror host stops resolving, apt waits on DNS for every file and
      # the step fails after ten minutes. So the list keeps only mirrors that
      # resolve, then adds public fallbacks. apt checks every package against
      # Ubuntu's signing key, whichever mirror serves it.
      - name: Install Chromium
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npx playwright install chromium
          list=/etc/apt/apt-mirrors.txt
          fallbacks="http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/ http://mirror.math.princeton.edu/pub/ubuntu/"
          for url in $( { cut -f1 "$list" 2>/dev/null || true; } ) $fallbacks; do
            host="${url#*://}"; host="${host%%/*}"
            if timeout 5 getent hosts "$host" >/dev/null; then
              echo "apt mirror resolves: $url" >&2
              echo "$url"
            else
              echo "::warning::apt mirror does not resolve, so it is skipped: $url" >&2
            fi
          done | grep -E '^https?://' | awk '!seen[$0]++' > "$RUNNER_TEMP/apt-mirrors.txt" || true
          if [ -f "$list" ] && [ -s "$RUNNER_TEMP/apt-mirrors.txt" ]; then
            sudo cp "$RUNNER_TEMP/apt-mirrors.txt" "$list"
          fi
          cat "$list" 2>/dev/null || true
          npx playwright install-deps chromium

      - name: Choose Playwright port
        if: steps.scope.outputs.scope == 'code'
        uses: ./.github/actions/pubmax-playwright-port

      # One worker. Four killed the single production server on this rig, and
      # on 3-4 Oct 2026 this cap is what passed once the machine was quiet.
      - name: Run law-pinning journeys
        if: steps.scope.outputs.scope == 'code'
        env:
          PUBMAX_TRACKED_OUTPUTS: public/data
          NODE_OPTIONS: "--max-old-space-size=6144"
          # The build skips its own type check; the CI Typecheck (TypeScript 6)
          # job checks a wider set (docs/CI_RUNBOOK.md, "Build cache and type check").
          PUBMAX_CI_SKIP_BUILD_TYPECHECK: "1"
          PUBMAX_E2E_KEYLESS: "1"
          PW_SKIP_KEYLESS_WEBSERVER: "1"
          # The gate below judges the RUN, so the run has to write a report.
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-law-pins.json"
        run: >-
          npx playwright test
          --reporter=list,json
          e2e/smoke.spec.ts
          e2e/admin-document-guard.spec.ts
          e2e/account-switch-identity.spec.ts
          e2e/plan-capability-recovery.spec.ts
          e2e/plan-held-acceptance.spec.ts
          e2e/map-surface-history.spec.ts
          e2e/ux-click-recovery.spec.ts
          e2e/seo-audit-discovery.spec.ts
          e2e/surface-back-and-home.spec.ts
          e2e/visit-reports.spec.ts
          e2e/landing-find-my-pint.spec.ts
          e2e/out-tab.spec.ts
          e2e/one-good-night-recovery.spec.ts
          --project=chromium
          --workers=1

      # A skipped browser test is a lane nobody proved, so the law pins are held
      # to zero UNARGUED skips. scripts/assert-no-conditional-e2e-skips.mjs
      # refuses one in the source; this refuses one at run time, and both read
      # the same argued list. See docs/rules/scripts-ci-gates-and-audits.md
      # for the skip policy and docs/testing/signed-in-review.md for Plan recovery.
      - name: Gate the law-pinning run
        if: steps.scope.outputs.scope == 'code'
        run: >-
          node scripts/assert-playwright-gate.mjs playwright-law-pins.json
          --require-zero-skipped
          --skips-argued e2e/conditional-skips.allowlist.json

  change-scope:
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') }}
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Change scope
    # Decides once, on Linux, whether this change needs the macOS layout
    # pins. A docs-only pull request used to hold Mac runners even when
    # all its steps were skipped. The layout-pin jobs read the "layout" output
    # and are skipped whole when it is not "ui", so a pull request that changes no
    # screen code starts no macOS runner. They are three named jobs, not a
    # matrix: a skipped matrix job reports under its unexpanded name, but a
    # skipped named job reports under its own name and counts as passed for
    # branch protection.
    # For eligible events, the layout jobs run even if this job fails, so a
    # broken classifier can never turn a code change into a skipped (passed)
    # layout check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      layout: ${{ steps.layout.outputs.layout }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Classify the layout change
        id: layout
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          layout=ui
          if [ "$EVENT_NAME" = pull_request ]; then
            layout="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              { files++ }
              /^__tests__\// || /^data\// || /^public\/data\// { next }
              /^supabase\/(migrations|rollbacks)\// || /^docs\// || /\.md$/ { next }
              /^scripts\/e2e\/canonical-price-server\.ts$/ { ui++; next }
              /^scripts\// || /^app\/api\// || /^app\/(.*\/)?route\.[cm]?[jt]sx?$/ { next }
              { ui++ }
              END { if (ui || !files) print "ui"; else print "none" }')"
          fi
          echo "layout=$layout" >> "$GITHUB_OUTPUT"
          echo "Layout scope: $layout"

  layout-pins-1:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Browser layout pins (1/3)
    # The browser specs that hold layout and chrome once held by source-text
    # unit tests (the CSS and JSX regex pins removed in the test-suite prune).
    # A regex over a stylesheet no longer guards these surfaces, so the specs
    # that measure them run before any screen-code change lands. They are
    # cut into three shards on separate runners, one worker each, so the law
    # pins above keep their own clock. The three jobs share one step list
    # (the YAML anchor below) and differ only in LAYOUT_SHARD.
    # They run on macOS, on the pubmax-mac self-hosted pool. The specs were
    # proved on macOS glyph widths, and on ubuntu-latest (16 Oct 2026) four
    # of them failed on a measured edge, for example 7px short at 320px.
    # Runner-up's fork guard controls runner access. GitHub also requires
    # approval for all outside collaborators. The `if` condition adds defence
    # in depth only (docs/CI_RUNBOOK.md, "Self-hosted Mac runners").
    # They run in the merge queue, on the commit that lands, and on a pull
    # request only while it carries the `layout-pins` label (captain, 9 Nov
    # 2026). Other label events skip every job. Unlabelled pull request pushes
    # and main pushes do not start them. The pool has three places. The
    # layout scope above still skips them for a pull request with no screen
    # code. A dispatch skips them to avoid duplicate runs on the Mac pool.
    # docs/CI_RUNBOOK.md, "The nightly full suite", owns quarantine exclusions.
    needs: [change-scope]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (!cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'layout-pins'))) && (needs.change-scope.result != 'success' || needs.change-scope.outputs.layout == 'ui')) }}
    runs-on: pubmax-mac
    timeout-minutes: 40
    env:
      LAYOUT_SHARD: 1
    steps: &layout-pin-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep caches inside the job
        uses: ./.github/actions/pubmax-job-local-caches

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Restore Playwright's browsers
        uses: ./.github/actions/pubmax-playwright-browsers

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Choose Playwright port
        uses: ./.github/actions/pubmax-playwright-port

      # Playwright's --shard cuts by test count, and the slow map specs sat
      # together in the last shard. scripts/ci/layout-pin-shard.mjs picks this
      # shard's specs by measured time instead.
      - name: Run layout-pinning journeys
        env:
          PUBMAX_TRACKED_OUTPUTS: public/data
          NODE_OPTIONS: "--max-old-space-size=6144"
          # The build skips its own type check; the CI Typecheck (TypeScript 6)
          # job checks a wider set (docs/CI_RUNBOOK.md, "Build cache and type check").
          PUBMAX_CI_SKIP_BUILD_TYPECHECK: "1"
          PUBMAX_E2E_KEYLESS: "1"
          PW_SKIP_KEYLESS_WEBSERVER: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-layout-pins-${{ env.LAYOUT_SHARD }}.json"
        run: |
          set -euo pipefail
          shard="$(node scripts/ci/layout-pin-shard.mjs ${{ env.LAYOUT_SHARD }} 3 \
            e2e/aperture-splash.spec.ts \
            e2e/avatar-wp3-mobile.spec.ts \
            e2e/consent-after-first-answer.spec.ts \
            e2e/core-route-smoke.spec.ts \
            e2e/crews-and-people.spec.ts \
            e2e/dark-primary-surfaces.spec.ts \
            e2e/design-review-followups.spec.ts \
            e2e/design-taste-wave-1.spec.ts \
            e2e/desktop-map-chrome-fit.spec.ts \
            e2e/desktop-map-large-text.spec.ts \
            e2e/desktop-map-rail.spec.ts \
            e2e/desktop-sheet-chrome-fit.spec.ts \
            e2e/drink-chip-controls.spec.ts \
            e2e/feedback.spec.ts \
            e2e/first-run-chrome-share.spec.ts \
            e2e/first-run-tour-placement.spec.ts \
            e2e/landing-uk-directory.spec.ts \
            e2e/launch-phone-controls.spec.ts \
            e2e/map-arrival-card-pins.spec.ts \
            e2e/map-arrival.spec.ts \
            e2e/map-blocked-fallback.spec.ts \
            e2e/map-body-clearance.spec.ts \
            e2e/map-consent-bottom-controls.spec.ts \
            e2e/map-desktop-arrival-chrome.spec.ts \
            e2e/map-desktop-filters.spec.ts \
            e2e/map-fallback.spec.ts \
            e2e/map-search-no-results.spec.ts \
            e2e/map-search-typing.spec.ts \
            e2e/map-selection-history.spec.ts \
            e2e/map-tile-retry.spec.ts \
            e2e/mobile-bottom-nav.spec.ts \
            e2e/mobile-button-system.spec.ts \
            e2e/mobile-city-chooser.spec.ts \
            e2e/mobile-feed-actions.spec.ts \
            e2e/mobile-first-run-tour.spec.ts \
            e2e/mobile-landing-entry.spec.ts \
            e2e/mobile-map-chrome-fit.spec.ts \
            e2e/mobile-map-controls.spec.ts \
            e2e/mobile-map-first-visit.spec.ts \
            e2e/mobile-map-search.spec.ts \
            e2e/mobile-map-shell-matrix.spec.ts \
            e2e/mobile-pal-layout.spec.ts \
            e2e/mobile-profile.spec.ts \
            e2e/mobile-venue-sheet-tabs.spec.ts \
            e2e/native-onboarding-actions.spec.ts \
            e2e/night-mode-chrome.spec.ts \
            e2e/pal-chat-composer.spec.ts \
            e2e/passport-and-activity.spec.ts \
            e2e/phone-tap-targets.spec.ts \
            e2e/plan-crawl-stops.spec.ts \
            e2e/plan-invite.spec.ts \
            e2e/plan-join-reveal.spec.ts \
            e2e/plan-route-result.spec.ts \
            e2e/price-caption-integrity.spec.ts \
            e2e/profile-avatar.spec.ts \
            e2e/profile-hero-desktop.spec.ts \
            e2e/public-updates.spec.ts \
            e2e/quality-floor.spec.ts \
            e2e/social-composer.spec.ts \
            e2e/tonight-vibe-chips.spec.ts \
            e2e/tonight.spec.ts \
            e2e/ui-consistency-layout.spec.ts \
            e2e/ui-empty-states-fit.spec.ts \
            e2e/ux-consent-chrome.spec.ts \
            e2e/venue-sheet-tablet-command-bar.spec.ts \
            e2e/venue-tabs-fit.spec.ts \
            e2e/web-first-run-journey.spec.ts \
            e2e/wordmark-chrome.spec.ts
          )"
          read -r -a specs <<< "$shard"
          npx playwright test \
            --reporter=list,json \
            "${specs[@]}" \
            --project=chromium \
            --project=chromium-gl \
            --project=chromium-no-gl \
            --workers=1

      - name: Gate the layout-pinning shard
        run: >-
          node scripts/assert-playwright-gate.mjs playwright-layout-pins-${{ env.LAYOUT_SHARD }}.json
          --require-zero-skipped
          --skips-argued e2e/conditional-skips.allowlist.json

  layout-pins-2:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Browser layout pins (2/3)
    needs: [change-scope]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (!cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'layout-pins'))) && (needs.change-scope.result != 'success' || needs.change-scope.outputs.layout == 'ui')) }}
    runs-on: pubmax-mac
    timeout-minutes: 40
    env:
      LAYOUT_SHARD: 2
    steps: *layout-pin-steps

  layout-pins-3:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Browser layout pins (3/3)
    needs: [change-scope]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (!cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'layout-pins'))) && (needs.change-scope.result != 'success' || needs.change-scope.outputs.layout == 'ui')) }}
    runs-on: pubmax-mac
    timeout-minutes: 40
    env:
      LAYOUT_SHARD: 3
    steps: *layout-pin-steps

  # THE REQUIRED CHECK (docs/CI_RUNBOOK.md, "The required checks and the merge
  # queue"). The main ruleset requires this one check by name, not each job,
  # so a shard can be added or a job skipped with no settings change. It needs
  # every job a pull request runs (__tests__/ciSummaryCheck.test.ts) and is
  # red when any of them failed or was cancelled. `always()` makes it report
  # even then: a summary that was skipped would count as passed. A layout pin
  # skipped by its own `if` (no screen code, a fork, a pull request without
  # the layout-pins label, a main push) passes.
  # The nightly full suite is not a pull request job, so it is not needed here.
  check:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Browser tests check
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (always()) }}
    needs: [queue-proof, law-pins, change-scope, layout-pins-1, layout-pins-2, layout-pins-3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          red="$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$red" ]; then
            echo "::error::Not green: $red"
            exit 1
          fi

  full-suite:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Full browser suite (${{ matrix.shard }}/8)
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (github.event_name == 'workflow_dispatch') }}
    runs-on: pubmax-mac
    timeout-minutes: 45
    # The hosted macOS runners gave Playwright one worker. Two shards of about
    # 645 tests each did not finish inside the 45-minute ceiling (4 Oct 2026
    # nightly and dispatch), so the suite was cut into four. By 28 Oct the four
    # shards held about 620 tests each: shard 4 was cancelled at 45 minutes on
    # 8 of 8 nights and shard 1 on most, so their failures never printed.
    # Playwright cuts shards by test COUNT, and the slow specs (the map group
    # and the WebGL projects) sit together at the end of its order, so more
    # count-cut shards of every project still left one shard over the wall.
    # The plain Chromium project is cut into eight here, and the WebGL and
    # keyless projects run as one job below. Measured from the 25-28 Oct
    # nightly logs, the slowest Chromium shard is about 29 minutes of tests
    # beside one production build. It stays on macOS: on ubuntu-latest
    # (16 Oct 2026) it failed 19 more tests than the macOS nightly, most of
    # them layout measures.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep caches inside the job
        uses: ./.github/actions/pubmax-job-local-caches

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Restore Playwright's browsers
        uses: ./.github/actions/pubmax-playwright-browsers

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Choose Playwright port
        uses: ./.github/actions/pubmax-playwright-port

      # The Chromium project needs no keyless server, so each shard pays for
      # one production build rather than two (about 3.5 minutes each).
      # One worker, the count a hosted macOS runner gave it. Left unset, the
      # Mac pool's 18 cores would start 9 against one production server, and
      # four already killed that server on this rig.
      # e2e/full-suite-quarantine.txt leaves out each known-red test until its
      # tracking issue is fixed, so a new failure turns the run red.
      - name: Run full browser shard
        env:
          PUBMAX_TRACKED_OUTPUTS: public/data
          NODE_OPTIONS: "--max-old-space-size=6144"
          # The build skips its own type check; the CI Typecheck (TypeScript 6)
          # job checks a wider set (docs/CI_RUNBOOK.md, "Build cache and type check").
          PUBMAX_CI_SKIP_BUILD_TYPECHECK: "1"
          PUBMAX_E2E_KEYLESS: "1"
          PW_SKIP_KEYLESS_WEBSERVER: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-default-${{ matrix.shard }}.json"
        run: >-
          npx playwright test
          --reporter=list,json
          --project=chromium
          --workers=1
          --shard=${{ matrix.shard }}/8
          --test-list-invert=e2e/full-suite-quarantine.txt

      - name: Gate the full browser shard
        run: node scripts/assert-playwright-gate.mjs playwright-default-${{ matrix.shard }}.json

  full-suite-gl:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Full browser suite (WebGL and keyless)
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (github.event_name == 'workflow_dispatch') }}
    runs-on: pubmax-mac
    timeout-minutes: 45
    # Every project the Chromium shards above do not run: the SwiftShader map
    # journeys, the service-worker map, the no-WebGL fallback and the keyless
    # build's own specs. About 131 tests and 16 minutes of them by the 25-28 Oct
    # nightly logs, beside the two production builds the keyless project needs.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep caches inside the job
        uses: ./.github/actions/pubmax-job-local-caches

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Restore Playwright's browsers
        uses: ./.github/actions/pubmax-playwright-browsers

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Choose Playwright port
        uses: ./.github/actions/pubmax-playwright-port

      # One worker, for the reason the Chromium shards above give.
      - name: Run the WebGL and keyless projects
        env:
          PUBMAX_TRACKED_OUTPUTS: public/data
          NODE_OPTIONS: "--max-old-space-size=6144"
          # The build skips its own type check; the CI Typecheck (TypeScript 6)
          # job checks a wider set (docs/CI_RUNBOOK.md, "Build cache and type check").
          PUBMAX_CI_SKIP_BUILD_TYPECHECK: "1"
          PUBMAX_E2E_KEYLESS: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-default-gl.json"
        run: >-
          npx playwright test
          --reporter=list,json
          --project=chromium-keyless
          --project=chromium-gl
          --project=chromium-sw-gl
          --project=chromium-no-gl
          --workers=1
          --test-list-invert=e2e/full-suite-quarantine.txt

      - name: Gate the WebGL and keyless run
        run: node scripts/assert-playwright-gate.mjs playwright-default-gl.json

  nightly-failure-issue:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'layout-pins' && 'Not run for label - ' || '' }}Report a nightly full-suite failure
    # alert-on-failure.yml requires a webhook secret, so this job reports
    # without one. It checks out nothing and runs no repository code.
    # docs/CI_RUNBOOK.md, "The nightly full suite", owns the reporting policy.
    # The nightly is a dispatch on main. A dispatch on any other branch is a
    # check of that branch, so it reports nothing here.
    needs: [full-suite, full-suite-gl]
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'layout-pins') && (always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          SHARDS_RESULT: ${{ needs.full-suite.result }}
          GL_RESULT: ${{ needs.full-suite-gl.result }}
        run: |
          set -euo pipefail
          title="Nightly full browser suite failed"
          body="$(printf '%s\n\n- Run: %s\n- Commit: %s\n- Full browser suite (n/8): %s\n- Full browser suite (WebGL and keyless): %s\n' \
            "The nightly full browser suite did not pass." \
            "$RUN_URL" "$HEAD_SHA" "$SHARDS_RESULT" "$GL_RESULT")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --limit 20 \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on issue #$number."
          else
            gh issue create --title "$title" --body "$body"
          fi
