name: Self-hosted runner probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize pubmax-mac workflows on this ref only (repo-wide group blocked other branches).
  group: pubmax-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Prove pubmax-mac runner
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 5
    steps:
      - name: Node version
        run: node --version
