name: Hosted runner probe

# workflow_dispatch smoke for the GitHub-hosted runner. The Mac identity
# check is retired with the self-hosted runners. See docs/CI_RUNBOOK.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Prove ubuntu-latest Node
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Node version
        run: node --version
