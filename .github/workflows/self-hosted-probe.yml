name: Self-hosted runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize pubmax-mac workflows on this ref only (repo-wide group blocked other branches).
  group: ${{ github.workflow }}-pubmax-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Prove pubmax-mac runner
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse the console user
        run: bash scripts/ci/assert-runner-identity.sh

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Node version
        run: node --version
