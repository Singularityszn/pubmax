name: Self-hosted runner probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One self-hosted Mac shares a single _work checkout; parallel jobs stomp
  # the tree (validate-data temp collisions, build:slim vs Playwright guard).
  group: pubmax-mac-${{ github.repository }}
  cancel-in-progress: true

jobs:
  probe:
    name: Prove pubmax-mac runner
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 5
    steps:
      - name: Node version
        run: node --version
