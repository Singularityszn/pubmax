name: CI

# GitHub-hosted ubuntu-latest. The repository is public, so CI does not run
# on a personal Mac. Playwright jobs live in e2e.yml and performance.yml
# and use macos-latest. Effective RLS stays in
# rls-session.yml so this workflow stays lean. Job timeout-minutes are the
# ceilings already measured for these jobs; see docs/CI_RUNBOOK.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per workflow, event and ref. A newer pull request head
  # supersedes older runs of this workflow. Main and dispatch runs finish.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  review-scope:
    name: Review scope
    runs-on: ubuntu-latest
    timeout-minutes: 11
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout full diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check changed-file scope
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # A merged commit on main cannot be rewritten, so only a pull request
        # reads its CI-step fix commits.
        run: |
          args=(--base "$REVIEW_BASE_SHA" --head "$REVIEW_HEAD_SHA")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--ci-commits); fi
          node scripts/check_review_scope.mjs "${args[@]}"

  lint-and-types:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope != 'docs'
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Lint
        if: steps.scope.outputs.scope != 'docs'
        run: npm run lint

      - name: Typecheck
        if: steps.scope.outputs.scope != 'docs'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        # Generates the typedRoutes link types before the native tsc pass.
        run: npm run typecheck

      - name: Typecheck (TypeScript 6)
        if: steps.scope.outputs.scope != 'docs'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        # The bridge compiler Next builds with, over the full tsconfig. The
        # route types come from the step above. `npx tsc` is TypeScript 7.
        run: node node_modules/typescript/bin/tsc --noEmit

  production-build:
    name: Production build
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Build
        if: steps.scope.outputs.scope == 'code'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

  # The unit shards start at once, beside lint and the production build: they
  # build their own slim data and read nothing those jobs make. Each shard
  # collects coverage for its half of the suite into a blob report, and the
  # Coverage job merges the two blobs and enforces the thresholds in
  # vitest.config.mts. A shard's own half cannot meet them, so the shards
  # turn thresholds off and the merge holds the whole-suite gate.
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code' || matrix.shard == 1
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code' || matrix.shard == 1
        run: |
          npm ci
          npm run deps:install-scripts

      # Fresh checkout: production-build does not upload data/generated, but
      # validate-data and venue route tests expect slim/detail artifacts.
      - name: Build slim venue artifacts
        if: steps.scope.outputs.scope == 'code' || matrix.shard == 1
        run: npm run build:slim

      # Postgres/PostgREST proofs live in rls-session.yml, the one job that
      # installs a cluster. `--without-postgres` excludes exactly the suites
      # named in scripts/rls/postgresSuites.mjs, so a new proof cannot land in
      # a job with no PostgreSQL and report itself skipped while the job stays
      # green. PUBMAX_RLS_NO_PG=1 stays set because a hosted image can expose
      # partial client tools; with the suites excluded it changes nothing here
      # and keeps a stray probe on the loud-skip path.
      - name: Unit tests with coverage
        if: steps.scope.outputs.scope == 'code'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_RLS_NO_PG: "1"
        run: >-
          npm run coverage --
          --without-postgres
          --shard=${{ matrix.shard }}/2
          --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.lines=0
          --reporter=default
          --reporter=blob
          --outputFile.blob=blob-reports/blob-${{ matrix.shard }}.json

      # A docs or data pull request skips the whole-suite shards, but a unit
      # fence can read the very file it changed (an AGENTS.md, a pack, the
      # freshness registry). So shard 1 runs every unit test whose source
      # names a changed file by path or by file name, PostgreSQL suites aside
      # (rls-session.yml owns those). Main runs the whole suite on merge.
      - name: Unit tests that name a changed file
        if: steps.scope.outputs.scope != 'code' && matrix.shard == 1
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_RLS_NO_PG: "1"
        run: |
          set -euo pipefail
          postgres_suites="$(node --input-type=module -e 'import { POSTGRES_BACKED_SUITES } from "./scripts/rls/postgresSuites.mjs"; console.log(POSTGRES_BACKED_SUITES.join("\n"))')"
          tests="$(git diff --no-renames --name-only HEAD^1 HEAD | while IFS= read -r file; do
            [ -n "$file" ] || continue
            grep -rlF -e "$file" -e "$(basename "$file")" __tests__ --include='*.test.ts' --include='*.test.tsx' || true
          done | sort -u | grep -vxF -f <(printf '%s\n' "$postgres_suites") || true)"
          if [ -z "$tests" ]; then
            echo "No unit test names a changed file."
            exit 0
          fi
          printf 'Running:\n%s\n' "$tests"
          # shellcheck disable=SC2086 # one test path per word
          npx vitest run $tests

      - name: Upload coverage blob
        if: steps.scope.outputs.scope == 'code'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-blob-${{ matrix.shard }}
          path: blob-reports/blob-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"
      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Download coverage blobs
        if: steps.scope.outputs.scope == 'code'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unit-blob-*
          path: blob-reports
          merge-multiple: true
      - name: Enforce coverage
        if: steps.scope.outputs.scope == 'code'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx vitest --merge-reports=blob-reports --coverage

  freshness:
    name: Freshness release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Check every tracked feed
        run: |
          npm run check:freshness -- --artifacts-only
          node scripts/check-production-store-freshness.mjs

  # The bundled datasets and city packs, held to scripts/validate-data.mjs on
  # every pull request and every push to main. Before this job the validator
  # ran only inside a local `npm run verify`, so a pack change that skipped it
  # reached main unchecked. It runs on its own, like the freshness gate.
  # PUBMAX_VERIFY_COMMITTED_DATA=1 skips the rebuild, so the committed packs are
  # checked as they ship. Only the gitignored venue detail files are generated.
  validate-data:
    name: Data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Generate the gitignored venue detail files
        run: npm run build:venue-details
      - name: Validate every bundled dataset
        env:
          PUBMAX_VERIFY_COMMITTED_DATA: "1"
        run: npm run validate-data
