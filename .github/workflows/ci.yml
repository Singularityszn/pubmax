name: CI

# GitHub-hosted ubuntu-latest. The repository is public, so CI does not run
# on a personal Mac. No job needs macOS. Effective RLS stays in
# rls-session.yml so this workflow stays lean. Job timeout-minutes are the
# ceilings already measured for these jobs; see docs/CI_RUNBOOK.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per workflow, event and ref. A newer pull request head
  # supersedes older runs of this workflow. Main and dispatch runs finish.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  review-scope:
    name: Review scope
    runs-on: ubuntu-latest
    timeout-minutes: 11
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout full diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check changed-file scope
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check_review_scope.mjs --base "$REVIEW_BASE_SHA" --head "$REVIEW_HEAD_SHA"

  lint-and-types:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx tsc --noEmit

  production-build:
    name: Production build
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

  unit-tests:
    needs: [production-build]
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts

      # Fresh checkout: production-build does not upload data/generated, but
      # validate-data and venue route tests expect slim/detail artifacts.
      - name: Build slim venue artifacts
        run: npm run build:slim

      # Postgres/PostgREST proofs live in rls-session.yml, the one job that
      # installs a cluster. This job excludes exactly the suites named in
      # scripts/rls/postgresSuites.mjs, and __tests__/postgresSuiteInventory.
      # test.ts holds the two lists to each other, so a new proof cannot land
      # in a job with no PostgreSQL and report itself skipped while the job
      # stays green. PUBMAX_RLS_NO_PG=1 stays set because a hosted image can
      # expose partial client tools; with the suites excluded it changes
      # nothing here and keeps a stray probe on the loud-skip path.
      - name: Unit tests
        env:
          PUBMAX_RLS_NO_PG: "1"
        run: >-
          npx vitest run
          --shard=${{ matrix.shard }}/2
          --exclude '__tests__/accountRemovalMigrationEffective.test.ts'
          --exclude '__tests__/accountRetentionLedgerMigrationEffective.test.ts'
          --exclude '__tests__/accountVisibilityMigrationEffective.test.ts'
          --exclude '__tests__/browserRoleGrantFence.test.ts'
          --exclude '__tests__/drinkWallRlsMigrationEffective.test.ts'
          --exclude '__tests__/foundingMembersMigration.test.ts'
          --exclude '__tests__/groupMessageThreadsMigrationEffective.test.ts'
          --exclude '__tests__/handleClaimNoInheritanceMigration.test.ts'
          --exclude '__tests__/harvestOverlayMigration.test.ts'
          --exclude '__tests__/messageIdempotencyMigrationEffective.test.ts'
          --exclude '__tests__/messagingChannelOwnershipMigrationEffective.test.ts'
          --exclude '__tests__/messagingRealtimeAuthorizationMigrationEffective.test.ts'
          --exclude '__tests__/nightSignalCheckpointMigrationEffective.test.ts'
          --exclude '__tests__/occupancyMigration0109.test.ts'
          --exclude '__tests__/occupancyMigrationEffective.test.ts'
          --exclude '__tests__/oneTapPricePairRemovalEffective.test.ts'
          --exclude '__tests__/openSocialCrewsMigration.test.ts'
          --exclude '__tests__/permissionMatrixEffective.test.ts'
          --exclude '__tests__/pintDropConfirmationsMigrationEffective.test.ts'
          --exclude '__tests__/pintDropDailyCapAtomicEffective.test.ts'
          --exclude '__tests__/pintDropMeasureMigrationEffective.test.ts'
          --exclude '__tests__/pintDropVerifiedReportsMigrationEffective.test.ts'
          --exclude '__tests__/pintDropsTableDoorMigrationEffective.test.ts'
          --exclude '__tests__/planAccountTransitionMigrationEffective.test.ts'
          --exclude '__tests__/planJoinRevokedPrecheckEffective.test.ts'
          --exclude '__tests__/planLegacyReplayCapabilityEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceCompletionMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceContextMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceCreateMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceProposalMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceReplaceContextMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceReplaceMigrationEffective.test.ts'
          --exclude '__tests__/postgresHarnessTimeouts.test.ts'
          --exclude '__tests__/postgresShmHarness.test.ts'
          --exclude '__tests__/priceTrustEventsMigrationEffective.test.ts'
          --exclude '__tests__/publicGrantSweepMigrationEffective.test.ts'
          --exclude '__tests__/publicWithdrawnProfilesMigrationEffective.test.ts'
          --exclude '__tests__/rateLimitExpiryMigration.test.ts'
          --exclude '__tests__/rlsWave2Session.test.ts'
          --exclude '__tests__/socialComposerMigration.test.ts'
          --exclude '__tests__/socialCrewLegacyRoutesRls.test.ts'
          --exclude '__tests__/socialCrewMigration.test.ts'
          --exclude '__tests__/socialIdentityMigration.test.ts'
          --exclude '__tests__/socialInteractionsMigration.test.ts'
          --exclude '__tests__/socialPostsMigration.test.ts'
          --exclude '__tests__/supabaseHygieneMigrationEffective.test.ts'
          --exclude '__tests__/wantedPromotionMigrationEffective.test.ts'
          --exclude '__tests__/whatsOnListingsMigration.test.ts'

  coverage:
    name: Coverage
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Enforce coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_RLS_NO_PG: "1"
        run: >-
          npm run coverage --
          --exclude '__tests__/accountRemovalMigrationEffective.test.ts'
          --exclude '__tests__/accountRetentionLedgerMigrationEffective.test.ts'
          --exclude '__tests__/accountVisibilityMigrationEffective.test.ts'
          --exclude '__tests__/browserRoleGrantFence.test.ts'
          --exclude '__tests__/drinkWallRlsMigrationEffective.test.ts'
          --exclude '__tests__/foundingMembersMigration.test.ts'
          --exclude '__tests__/groupMessageThreadsMigrationEffective.test.ts'
          --exclude '__tests__/handleClaimNoInheritanceMigration.test.ts'
          --exclude '__tests__/harvestOverlayMigration.test.ts'
          --exclude '__tests__/messageIdempotencyMigrationEffective.test.ts'
          --exclude '__tests__/messagingChannelOwnershipMigrationEffective.test.ts'
          --exclude '__tests__/messagingRealtimeAuthorizationMigrationEffective.test.ts'
          --exclude '__tests__/nightSignalCheckpointMigrationEffective.test.ts'
          --exclude '__tests__/occupancyMigration0109.test.ts'
          --exclude '__tests__/occupancyMigrationEffective.test.ts'
          --exclude '__tests__/oneTapPricePairRemovalEffective.test.ts'
          --exclude '__tests__/openSocialCrewsMigration.test.ts'
          --exclude '__tests__/permissionMatrixEffective.test.ts'
          --exclude '__tests__/pintDropConfirmationsMigrationEffective.test.ts'
          --exclude '__tests__/pintDropDailyCapAtomicEffective.test.ts'
          --exclude '__tests__/pintDropMeasureMigrationEffective.test.ts'
          --exclude '__tests__/pintDropVerifiedReportsMigrationEffective.test.ts'
          --exclude '__tests__/pintDropsTableDoorMigrationEffective.test.ts'
          --exclude '__tests__/planAccountTransitionMigrationEffective.test.ts'
          --exclude '__tests__/planJoinRevokedPrecheckEffective.test.ts'
          --exclude '__tests__/planLegacyReplayCapabilityEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceCompletionMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceContextMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceCreateMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceProposalMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceReplaceContextMigrationEffective.test.ts'
          --exclude '__tests__/planSelectedDrinkEvidenceReplaceMigrationEffective.test.ts'
          --exclude '__tests__/postgresHarnessTimeouts.test.ts'
          --exclude '__tests__/postgresShmHarness.test.ts'
          --exclude '__tests__/priceTrustEventsMigrationEffective.test.ts'
          --exclude '__tests__/publicGrantSweepMigrationEffective.test.ts'
          --exclude '__tests__/publicWithdrawnProfilesMigrationEffective.test.ts'
          --exclude '__tests__/rateLimitExpiryMigration.test.ts'
          --exclude '__tests__/rlsWave2Session.test.ts'
          --exclude '__tests__/socialComposerMigration.test.ts'
          --exclude '__tests__/socialCrewLegacyRoutesRls.test.ts'
          --exclude '__tests__/socialCrewMigration.test.ts'
          --exclude '__tests__/socialIdentityMigration.test.ts'
          --exclude '__tests__/socialInteractionsMigration.test.ts'
          --exclude '__tests__/socialPostsMigration.test.ts'
          --exclude '__tests__/supabaseHygieneMigrationEffective.test.ts'
          --exclude '__tests__/wantedPromotionMigrationEffective.test.ts'
          --exclude '__tests__/whatsOnListingsMigration.test.ts'

  freshness:
    name: Freshness release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Check every tracked feed
        run: |
          npm run check:freshness -- --artifacts-only
          node scripts/check-production-store-freshness.mjs
