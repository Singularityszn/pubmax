name: CI

# GitHub-hosted ubuntu-latest. Playwright jobs live in e2e.yml,
# performance.yml and prod-smoke.yml; __tests__/ciRunnerIsolation.test.ts
# lists the ones on the pubmax-mac self-hosted pool. Effective RLS stays in
# rls-session.yml so this workflow stays lean. Job timeout-minutes are the
# ceilings already measured for these jobs; see docs/CI_RUNBOOK.md.

on:
  pull_request:
  # The merge queue tests the exact commit that will land on main
  # (docs/CI_RUNBOOK.md, "The required checks and the merge queue").
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a newer head cancels that pull request's
  # older run. Every other run (main push, schedule, dispatch) gets a
  # group of its own, so GitHub never drops it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # docs/CI_RUNBOOK.md owns the merge queue proof policy and its exceptions.
  queue-proof:
    name: Merge queue proof
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.proof.outputs.passed }}
    steps:
      - name: Find a green merge queue run of this workflow for this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path="${WORKFLOW_REF#"$REPO/"}"
          path="${path%%@*}"
          passed=false
          if runs="$(gh api "repos/$REPO/actions/runs?event=merge_group&status=success&head_sha=$SHA&per_page=100")" &&
            count="$(jq --arg path "$path" '[.workflow_runs[] | select(.path == $path)] | length' <<< "$runs")"; then
            if [ "$count" -gt 0 ]; then passed=true; fi
          else
            echo "::warning::Could not read the merge queue runs for $SHA, so every job runs."
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "Merge queue proof for $path at $SHA: $passed"

  review-scope:
    name: Review scope
    runs-on: ubuntu-latest
    timeout-minutes: 11
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout full diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check changed-file scope
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # A merged commit on main cannot be rewritten, so only a pull request
        # reads its CI-step fix commits.
        run: |
          args=(--base "$REVIEW_BASE_SHA" --head "$REVIEW_HEAD_SHA")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then args+=(--ci-commits); fi
          node scripts/check_review_scope.mjs "${args[@]}"

  lint-and-types:
    name: Lint and typecheck
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 31
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope != 'docs'
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Lint
        if: steps.scope.outputs.scope != 'docs'
        run: npm run lint

      - name: Typecheck
        if: steps.scope.outputs.scope != 'docs'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        # Generates the typedRoutes link types before the native tsc pass.
        run: npm run typecheck


  # The TypeScript 6 check runs in a job of its own, beside lint (captain,
  # 2 Nov 2026): it took 2:15 to 5:38 on hosted runners, and inside the lint
  # job it put lint and both compilers end to end on the slowest chain. It is
  # the bridge compiler Next builds with, over the full tsconfig; `next
  # typegen` writes the route types it reads. `npx tsc` is TypeScript 7.
  typecheck-ts6:
    name: Typecheck (TypeScript 6)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope != 'docs'
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: |
          npm ci
          npm run deps:install-scripts

      - name: Generate the route types
        if: steps.scope.outputs.scope != 'docs'
        run: npx next typegen

      - name: Typecheck (TypeScript 6)
        if: steps.scope.outputs.scope != 'docs'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: node node_modules/typescript/bin/tsc --noEmit

  # The production build starts beside lint (captain, 2 Nov 2026): it reads
  # nothing lint makes, and waiting on lint put the two end to end on the
  # slowest chain a pull request waits for. docs/plans/CI_SPEED_PLAN.md.
  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts

      # BUILD CACHE (docs/CI_RUNBOOK.md, "Build cache and type check"). Next keeps Turbopack's
      # build work in .next/cache, and a hosted runner starts empty, so every
      # CI build was cold and wrote a cache no run read. A pull request
      # restores the newest cache a main push saved for the same lockfile.
      # Only a push to main saves one, and at most one a day (the key ends
      # in the UTC date), so pull requests never write a cache main reads,
      # and a cache of about 500 MB per push cannot crowd out the other
      # caches in the repository's 10 GB, such as the nightly Tavily cursor.
      - name: Name the build cache for today
        id: cache-day
        if: steps.scope.outputs.scope == 'code'
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Next.js build cache
        id: build-cache
        if: steps.scope.outputs.scope == 'code'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.cache-day.outputs.day }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The Typecheck (TypeScript 6) job checks tsconfig.json, which covers
      # every file tsconfig.build.json does, with the same compiler, so this
      # build skips its own copy of that check (captain, 2 Nov 2026;
      # docs/CI_RUNBOOK.md, "Build cache and type check"). next.config.mjs
      # honours the variable only off Vercel, so a deploy build keeps it.
      - name: Build
        if: steps.scope.outputs.scope == 'code'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_CI_SKIP_BUILD_TYPECHECK: "1"
        run: npm run build

      - name: Save the Next.js build cache
        if: steps.scope.outputs.scope == 'code' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.cache-day.outputs.day }}

  # The unit shards start at once, beside lint and the production build: they
  # build their own slim data and read nothing those jobs make. Each of the
  # three shards (captain, 2 Nov 2026) collects coverage for its third of the
  # suite into a blob report, and the Coverage job merges the blobs and
  # enforces the thresholds in vitest.config.mts. A shard's own third cannot
  # meet them, so the shards turn thresholds off and the merge holds the
  # whole-suite gate.
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/3)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"

      - name: Setup Node
        if: steps.scope.outputs.scope == 'code' || matrix.shard == 1
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code' || matrix.shard == 1
        run: |
          npm ci
          npm run deps:install-scripts

      # Fresh checkout: production-build does not upload data/generated, but
      # validate-data and venue route tests expect slim/detail artifacts.
      - name: Build slim venue artifacts
        if: steps.scope.outputs.scope == 'code' || matrix.shard == 1
        run: npm run build:slim

      # Postgres/PostgREST proofs live in rls-session.yml, the one job that
      # installs a cluster. `--without-postgres` excludes exactly the suites
      # named in scripts/rls/postgresSuites.mjs, so a new proof cannot land in
      # a job with no PostgreSQL and report itself skipped while the job stays
      # green. PUBMAX_RLS_NO_PG=1 stays set because a hosted image can expose
      # partial client tools; with the suites excluded it changes nothing here
      # and keeps a stray probe on the loud-skip path.
      - name: Unit tests with coverage
        if: steps.scope.outputs.scope == 'code'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_RLS_NO_PG: "1"
        run: >-
          npm run coverage --
          --without-postgres
          --shard=${{ matrix.shard }}/3
          --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.lines=0
          --reporter=default
          --reporter=blob
          --outputFile.blob=blob-reports/blob-${{ matrix.shard }}.json

      # A docs or data pull request skips the whole-suite shards, but a unit
      # fence can read the very file it changed (an AGENTS.md, a pack, the
      # freshness registry). So shard 1 runs every unit test whose source
      # names a changed file by path or by file name, PostgreSQL suites aside
      # (rls-session.yml owns those). Main runs the whole suite on merge.
      - name: Unit tests that name a changed file
        if: steps.scope.outputs.scope != 'code' && matrix.shard == 1
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_RLS_NO_PG: "1"
        run: |
          set -euo pipefail
          postgres_suites="$(node --input-type=module -e 'import { POSTGRES_BACKED_SUITES } from "./scripts/rls/postgresSuites.mjs"; console.log(POSTGRES_BACKED_SUITES.join("\n"))')"
          tests="$(git diff --no-renames --name-only HEAD^1 HEAD | while IFS= read -r file; do
            [ -n "$file" ] || continue
            grep -rlF -e "$file" -e "$(basename "$file")" __tests__ --include='*.test.ts' --include='*.test.tsx' || true
          done | sort -u | grep -vxF -f <(printf '%s\n' "$postgres_suites") || true)"
          if [ -z "$tests" ]; then
            echo "No unit test names a changed file."
            exit 0
          fi
          printf 'Running:\n%s\n' "$tests"
          # shellcheck disable=SC2086 # one test path per word
          npx vitest run $tests

      - name: Upload coverage blob
        if: steps.scope.outputs.scope == 'code'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: blob-reports/blob-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: [unit-tests]
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: the merge and its base, for the change scope below.
          fetch-depth: 2

      # CHANGE SCOPE (docs/CI_RUNBOOK.md, "What a pull request runs"). A pull
      # request is checked out as its merge commit, whose first parent is the
      # base, so one diff names every file the merge would change. Only every
      # changed file being docs (docs/**, *.md) or data (data/**/*.json,
      # public/data/**) makes it "docs" or "data"; anything else, an empty diff
      # and every event other than a pull request is "code" and runs in full.
      # The job always runs and reports, so a required check never waits on a
      # job that was skipped. Every copy of this step is identical
      # (__tests__/ciChangeScope.test.ts).
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=code
          if [ "$EVENT_NAME" = pull_request ]; then
            scope="$(git diff --no-renames --name-only HEAD^1 HEAD | awk '
              NF == 0 { next }
              /^docs\// || /\.md$/ { docs++; next }
              /^data\/.*\.json$/ || /^public\/data\// { data++; next }
              { code++ }
              END { if (code || !(docs + data)) print "code"; else if (data) print "data"; else print "docs" }')"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Change scope: $scope"
      - name: Setup Node
        if: steps.scope.outputs.scope == 'code'
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.scope == 'code'
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Download coverage blobs
        if: steps.scope.outputs.scope == 'code'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-blob-*
          path: blob-reports
          merge-multiple: true
      - name: Enforce coverage
        if: steps.scope.outputs.scope == 'code'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx vitest --merge-reports=blob-reports --coverage

  # The bundled datasets and city packs, held to scripts/validate-data.mjs on
  # every pull request and every push to main. Before this job the validator
  # ran only inside a local `npm run verify`, so a pack change that skipped it
  # reached main unchecked. It runs on its own.
  # PUBMAX_VERIFY_COMMITTED_DATA=1 skips the rebuild, so the committed packs are
  # checked as they ship. Only the gitignored venue detail files are generated.
  validate-data:
    name: Data validation
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm run deps:install-scripts
      - name: Generate the gitignored venue detail files
        run: npm run build:venue-details
      - name: Validate every bundled dataset
        env:
          PUBMAX_VERIFY_COMMITTED_DATA: "1"
        run: npm run validate-data

  # THE REQUIRED CHECK (docs/CI_RUNBOOK.md, "The required checks and the merge
  # queue"). The main ruleset requires this one check by name, not each job,
  # so a job can be added, split or resharded with no settings change. It needs
  # every other job in this workflow (__tests__/ciSummaryCheck.test.ts) and is
  # red when any of them failed or was cancelled. `always()` makes it report
  # even then: a summary that was skipped would count as passed. A job skipped
  # by its own `if` (Review scope outside a pull request or a main push) passes.
  check:
    name: CI check
    if: ${{ always() }}
    needs: [queue-proof, review-scope, lint-and-types, typecheck-ts6, production-build, unit-tests, coverage, validate-data]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          red="$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$red" ]; then
            echo "::error::Not green: $red"
            exit 1
          fi
