name: CI

# GitHub-hosted `ubuntu-latest` runners, on the captain's 15 September 2026
# decision to stay inside the GitHub free minutes. History: Avrea runners
# (`avrea-ubuntu-latest-2-vcpu`) carried every job from 6 September, after
# GitHub-hosted allocation stopped answering on an organisation billing fault
# (no job started between 5 September 11:08Z and 6 September 16:37Z), and
# Blacksmith labels replaced them in #1652. The label is the only difference -
# the image is Ubuntu and every job below still installs its own toolchain.
# Effective RLS stays in rls-session.yml so this workflow stays lean and
# finishes under the 15-minute wall budget.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-scope:
    name: Review scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout full diff
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check changed-file scope
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check_review_scope.mjs --base "$REVIEW_BASE_SHA" --head "$REVIEW_HEAD_SHA"

  lint-and-types:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npx tsc --noEmit

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Postgres/PostgREST proofs live in rls-session.yml, the one job that
      # installs a cluster. This job excludes exactly the suites named in
      # scripts/rls/postgresSuites.mjs, and __tests__/postgresSuiteInventory.
      # test.ts holds the two lists to each other, so a new proof cannot land
      # in a job with no PostgreSQL and report itself skipped while the job
      # stays green. PUBMAX_RLS_NO_PG=1 stays set because a hosted image can
      # expose partial client tools; with the suites excluded it changes
      # nothing here and keeps a stray probe on the loud-skip path.
      - name: Unit tests
        env:
          PUBMAX_RLS_NO_PG: "1"
        run: >-
          npx vitest run
          --shard=${{ matrix.shard }}/4
          --exclude '__tests__/accountRemovalMigrationEffective.test.ts'
          --exclude '__tests__/accountRetentionLedgerMigrationEffective.test.ts'
          --exclude '__tests__/accountVisibilityMigrationEffective.test.ts'
          --exclude '__tests__/foundingMembersMigration.test.ts'
          --exclude '__tests__/groupMessageThreadsMigrationEffective.test.ts'
          --exclude '__tests__/handleClaimNoInheritanceMigration.test.ts'
          --exclude '__tests__/harvestOverlayMigration.test.ts'
          --exclude '__tests__/messageIdempotencyMigrationEffective.test.ts'
          --exclude '__tests__/messagingChannelOwnershipMigrationEffective.test.ts'
          --exclude '__tests__/messagingRealtimeAuthorizationMigrationEffective.test.ts'
          --exclude '__tests__/nightSignalCheckpointMigrationEffective.test.ts'
          --exclude '__tests__/occupancyMigration0109.test.ts'
          --exclude '__tests__/occupancyMigrationEffective.test.ts'
          --exclude '__tests__/oneTapPricePairRemovalEffective.test.ts'
          --exclude '__tests__/openSocialCrewsMigration.test.ts'
          --exclude '__tests__/permissionMatrixEffective.test.ts'
          --exclude '__tests__/pintDropConfirmationsMigrationEffective.test.ts'
          --exclude '__tests__/pintDropDailyCapAtomicEffective.test.ts'
          --exclude '__tests__/pintDropMeasureMigrationEffective.test.ts'
          --exclude '__tests__/pintDropVerifiedReportsMigrationEffective.test.ts'
          --exclude '__tests__/planAccountTransitionMigrationEffective.test.ts'
          --exclude '__tests__/planJoinRevokedPrecheckEffective.test.ts'
          --exclude '__tests__/planLegacyReplayCapabilityEffective.test.ts'
          --exclude '__tests__/priceTrustEventsMigrationEffective.test.ts'
          --exclude '__tests__/publicWithdrawnProfilesMigrationEffective.test.ts'
          --exclude '__tests__/rateLimitExpiryMigration.test.ts'
          --exclude '__tests__/rlsWave2Session.test.ts'
          --exclude '__tests__/socialComposerMigration.test.ts'
          --exclude '__tests__/socialCrewLegacyRoutesRls.test.ts'
          --exclude '__tests__/socialCrewMigration.test.ts'
          --exclude '__tests__/socialIdentityMigration.test.ts'
          --exclude '__tests__/socialInteractionsMigration.test.ts'
          --exclude '__tests__/socialPostsMigration.test.ts'
          --exclude '__tests__/wantedPromotionMigrationEffective.test.ts'
          --exclude '__tests__/whatsOnListingsMigration.test.ts'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Enforce coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          PUBMAX_RLS_NO_PG: "1"
        run: >-
          npm run coverage --
          --exclude '__tests__/accountRemovalMigrationEffective.test.ts'
          --exclude '__tests__/accountRetentionLedgerMigrationEffective.test.ts'
          --exclude '__tests__/accountVisibilityMigrationEffective.test.ts'
          --exclude '__tests__/foundingMembersMigration.test.ts'
          --exclude '__tests__/groupMessageThreadsMigrationEffective.test.ts'
          --exclude '__tests__/handleClaimNoInheritanceMigration.test.ts'
          --exclude '__tests__/harvestOverlayMigration.test.ts'
          --exclude '__tests__/messageIdempotencyMigrationEffective.test.ts'
          --exclude '__tests__/messagingChannelOwnershipMigrationEffective.test.ts'
          --exclude '__tests__/messagingRealtimeAuthorizationMigrationEffective.test.ts'
          --exclude '__tests__/nightSignalCheckpointMigrationEffective.test.ts'
          --exclude '__tests__/occupancyMigration0109.test.ts'
          --exclude '__tests__/occupancyMigrationEffective.test.ts'
          --exclude '__tests__/oneTapPricePairRemovalEffective.test.ts'
          --exclude '__tests__/openSocialCrewsMigration.test.ts'
          --exclude '__tests__/permissionMatrixEffective.test.ts'
          --exclude '__tests__/pintDropConfirmationsMigrationEffective.test.ts'
          --exclude '__tests__/pintDropDailyCapAtomicEffective.test.ts'
          --exclude '__tests__/pintDropMeasureMigrationEffective.test.ts'
          --exclude '__tests__/pintDropVerifiedReportsMigrationEffective.test.ts'
          --exclude '__tests__/planAccountTransitionMigrationEffective.test.ts'
          --exclude '__tests__/planJoinRevokedPrecheckEffective.test.ts'
          --exclude '__tests__/planLegacyReplayCapabilityEffective.test.ts'
          --exclude '__tests__/priceTrustEventsMigrationEffective.test.ts'
          --exclude '__tests__/publicWithdrawnProfilesMigrationEffective.test.ts'
          --exclude '__tests__/rateLimitExpiryMigration.test.ts'
          --exclude '__tests__/rlsWave2Session.test.ts'
          --exclude '__tests__/socialComposerMigration.test.ts'
          --exclude '__tests__/socialCrewLegacyRoutesRls.test.ts'
          --exclude '__tests__/socialCrewMigration.test.ts'
          --exclude '__tests__/socialIdentityMigration.test.ts'
          --exclude '__tests__/socialInteractionsMigration.test.ts'
          --exclude '__tests__/socialPostsMigration.test.ts'
          --exclude '__tests__/wantedPromotionMigrationEffective.test.ts'
          --exclude '__tests__/whatsOnListingsMigration.test.ts'

  freshness:
    name: Freshness release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check every tracked feed
        run: |
          npm run check:freshness -- --artifacts-only
          node scripts/check-production-store-freshness.mjs
