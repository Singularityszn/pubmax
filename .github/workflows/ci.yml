name: CI

on:
  # GitHub-HOSTED runners are account-billing-blocked on this private repo
  # (every run `startup_failure` pre-allocation). CI runs on the SELF-HOSTED
  # runner "chengdu-mac" instead — self-hosted minutes are free, so the
  # billing block is irrelevant. If the runner is offline, jobs queue rather
  # than fail; Vercel's build remains the independent second gate.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build-time data gate: every bundled dataset is validated with the same
      # rules the app uses, and a truncated pint dataset fails the run.
      - name: Validate data
        run: npm run validate-data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage gate: vitest fails the step if coverage drops below the
      # thresholds in vitest.config.ts, so a merge that regresses coverage
      # is blocked.
      - name: Unit tests (coverage gate)
        run: npm run coverage

      - name: Production build
        run: npm run build
