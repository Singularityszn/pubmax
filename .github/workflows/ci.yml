name: CI

on:
  # GitHub-hosted Actions still fail before job allocation on this private
  # repo (`startup_failure` with zero jobs — verified on push run 28893076008,
  # 2026-07-07). Vercel is the automatic CI/CD gate; keep this workflow
  # manual-only so every merge doesn't produce a red non-code failure.
  # Re-enable push/pull_request triggers once runner allocation is fixed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build-time data gate: every bundled dataset is validated with the same
      # rules the app uses, and a truncated pint dataset fails the run.
      - name: Validate data
        run: npm run validate-data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage gate: vitest fails the step if coverage drops below the
      # thresholds in vitest.config.ts, so a merge that regresses coverage
      # is blocked.
      # RLS session tests skip loudly here when Postgres is absent — they must
      # never fail this job and never report as passed. See rls-session job
      # below and .github/workflows/rls-session.yml for the real run.
      - name: Unit tests (coverage gate)
        run: npm run coverage

      - name: Production build
        run: npm run build

  # Real RLS proofs need Postgres 16 binaries and PostgREST 14.
  # Kept separate from `build` so Vercel-style hosts without a database can
  # still green `npm run ci` while this job fails if sessions regress.
  rls-session:
    name: Effective RLS (Postgres 16 + PostgREST 14)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 16 and PostgREST 14
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v14.16/postgrest-v14.16-linux-static-x86-64.tar.xz
          echo "36b8ae140f188cfcd6003494805bf35a41e895f88c12be9183d60f91782145c6  $RUNNER_TEMP/postgrest.tar.xz" \
            | sha256sum --check
          tar --extract --xz --file "$RUNNER_TEMP/postgrest.tar.xz" --directory "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/postgrest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          initdb --version
          postgres --version
          psql --version
          "$RUNNER_TEMP/postgrest" --version

      - name: Run effective RLS session tests
        run: npm run test:rls
        env:
          CI: true
