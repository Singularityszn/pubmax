name: What's-On events refresh

# Official-API events refresh for the Tonight page (Ticketmaster Discovery +
# Skiddle). Runs scripts/whatson/eventsRefresh.mjs, which fetches ONLY the two
# self-service, ToS-clean discovery APIs audited in
# docs/EVENT_SOURCES_RESEARCH_2026-07-18.md, normalises them into the B1
# WhatsOnRow contract, matches venues conservatively, and opens a PR for human
# review. It NEVER pushes to a protected branch and NEVER scrapes aggregators.
#
# Provider keys are optional at runtime. With neither key set, this remains a
# safe no-op:
#   * TICKETMASTER_API_KEY - free, instant, from developer.ticketmaster.com.
#   * SKIDDLE_API_KEY      - free key, BUT commercial use requires written
#                            approval from dev@skiddle.com first (see research
#                            doc §3). Keep this provider off until approved.
# With no keys set the refresh script noop-skips every provider and touches
# nothing. Provision one or both secrets to activate a provider.
on:
  schedule:
    - cron: "45 15 * * *"  # 15:45 UTC daily (afternoon, ahead of the evening)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh events + open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SKIDDLE_API_KEY: ${{ secrets.SKIDDLE_API_KEY }}
        run: npm run refresh:events -- --open-pr

      - name: Validate bundled data
        # Guard: the refresh must never ship data that fails the app's own
        # validation (schema, attribution, future-observedAt).
        run: npm run validate-data
