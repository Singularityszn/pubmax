name: Night Signal refresh

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure review-bot identity
        run: |
          git config user.name "pubmax-signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
      - name: Verify signal contracts
        run: npm test -- __tests__/nightSignalClaims.test.ts
      - name: Validate staged evidence and open a review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh:night-signals -- --open-pr
