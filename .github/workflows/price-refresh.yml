name: Price refresh

# Weekly permissible-source price refresh. Runs scripts/refresh_prices.mjs, which
# reads ONLY the first-party / open sources allowlisted in data/price_sources.json,
# validates + writes a versioned public/data/price_updates/prices_YYYYMMDD.json,
# and opens a PR for human review. It NEVER pushes to a protected branch and NEVER
# scrapes competitor price sites (governance hard rule).
on:
  schedule:
    # 07:00 UTC every Monday.
    - cron: "0 7 * * 1"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name "pubmax-price-bot"
          git config user.email "price-bot@users.noreply.github.com"

      - name: Run price refresh + open PR
        env:
          # `gh` uses this token to open the review PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh_prices.mjs --open-pr

      - name: Validate bundled data
        # Guard: the refresh must never ship data that fails the app's own
        # validation (bounds, schema, row floor).
        run: npm run validate-data
