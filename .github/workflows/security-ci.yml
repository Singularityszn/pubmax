name: Security CI

# zizmor (workflow lint), osv-scanner (lockfile CVEs), Semgrep CE (SAST).
# Self-hosted pubmax-mac only; tools installed via Homebrew (docs/CI_RUNBOOK.md).
# These checks are advisory: no branch protection requires them, so a red job
# here blocks nothing on its own. The weekly run catches a new advisory against
# a lockfile or a pinned action when no pull request is open.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pubmax-mac-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor (.github)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse the console user
        run: bash scripts/ci/assert-runner-identity.sh

      # Online, so the audits that ask GitHub about each pinned action
      # (impostor commits, known-vulnerable actions, ref confusion) run too.
      # The job token is read-only and is passed to this step alone.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low .github

  osv-scanner:
    name: osv-scanner (lockfiles)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse the console user
        run: bash scripts/ci/assert-runner-identity.sh

      # Recursive, so scripts/chatgpt-map, the iOS Package.resolved and any
      # lockfile added later are scanned without editing this line. It exits
      # non-zero when it finds no lockfile at all, so it cannot pass empty.
      - name: osv-scanner
        run: osv-scanner scan source --recursive .

  semgrep:
    name: Semgrep CE (SAST)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse the console user
        run: bash scripts/ci/assert-runner-identity.sh

      - name: Semgrep
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
          SSL_CERT_FILE: /etc/ssl/cert.pem
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/default \
            --metrics off \
            --severity ERROR \
            --error \
            --timeout 120 \
            --exclude node_modules \
            --exclude .next \
            --exclude public/data \
            --exclude uk_base/public/data \
            app lib components scripts proxy.ts next.config.mjs
