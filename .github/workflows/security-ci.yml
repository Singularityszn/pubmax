name: Security CI

# zizmor (workflow lint), osv-scanner (lockfile CVEs), Semgrep CE (SAST),
# gitleaks (secrets in the full git history).
# Each job installs its CLI on ubuntu-latest. These checks are advisory: no
# branch protection requires them, so a red job here blocks nothing on its own.
# The weekly run catches a new advisory against a lockfile or a pinned action
# when no pull request is open. The zizmor token is the job token, not a
# repository secret.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a newer head cancels that pull request's
  # older run. Every other run (main push, schedule, dispatch) gets a
  # group of its own, so GitHub never drops it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor (.github)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/zizmor.tar.gz" \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $RUNNER_TEMP/zizmor.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/zizmor.tar.gz" --directory "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/zizmor" /usr/local/bin/zizmor
          zizmor --version

      # Online, so the audits that ask GitHub about each pinned action
      # (impostor commits, known-vulnerable actions, ref confusion) run too.
      # The job token is read-only and is passed to this step alone.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low .github

  osv-scanner:
    name: osv-scanner (lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv-scanner" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          sudo mv "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
          osv-scanner --version

      # Recursive, so scripts/chatgpt-map, the iOS Package.resolved and any
      # lockfile added later are scanned without editing this line. It exits
      # non-zero when it finds no lockfile at all, so it cannot pass empty.
      - name: osv-scanner
        run: osv-scanner scan source --recursive .

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, because a secret removed in a later commit is still
      # readable in the one that added it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps a found value out of the job log. The allowlists and
      # their reasons are in .gitleaks.toml.
      # A PR scans its complete history. Main and scheduled scans retain all refs.
      - name: gitleaks
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && '--full-history HEAD' || '--full-history --all' }}
        run: gitleaks git --redact --verbose --no-banner --config .gitleaks.toml --log-opts="$GITLEAKS_LOG_OPTS" .

  semgrep:
    name: Semgrep CE (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          set -euo pipefail
          pipx install semgrep==1.179.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          semgrep --version

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/default \
            --metrics off \
            --severity ERROR \
            --error \
            --timeout 120 \
            --exclude node_modules \
            --exclude .next \
            --exclude public/data \
            --exclude uk_base/public/data \
            app lib components scripts proxy.ts next.config.mjs
