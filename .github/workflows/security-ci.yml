name: Security CI

# zizmor (workflow lint), osv-scanner (lockfile CVEs), Semgrep CE (SAST).
# Self-hosted pubmax-mac only; tools installed via Homebrew (docs/CI_RUNBOOK.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pubmax-mac-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor (workflows)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: zizmor
        run: node scripts/security/run-zizmor.mjs

  osv-scanner:
    name: osv-scanner (lockfile)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: osv-scanner
        run: node scripts/security/run-osv-scanner.mjs

  semgrep:
    name: Semgrep CE (SAST)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Semgrep
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
          SSL_CERT_FILE: /etc/ssl/cert.pem
        run: node scripts/security/run-semgrep.mjs
