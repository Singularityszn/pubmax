name: Security CI

# zizmor (workflow lint), osv-scanner (lockfile CVEs), Semgrep CE (SAST),
# gitleaks (secrets in git history; the range each event scans is set at the
# gitleaks step).
# Each job installs its CLI on ubuntu-latest.
# The weekly run catches a new advisory against a lockfile or a pinned action
# when no pull request is open. The zizmor token is the job token, not a
# repository secret.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per pull request: a newer head cancels that pull request's
  # older run. Every other run (main push, schedule, dispatch) gets a
  # group of its own, so GitHub never drops it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # docs/CI_RUNBOOK.md owns the merge queue proof policy and its exceptions.
  queue-proof:
    name: Merge queue proof
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.proof.outputs.passed }}
    steps:
      - name: Find a green merge queue run of this workflow for this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path="${WORKFLOW_REF#"$REPO/"}"
          path="${path%%@*}"
          passed=false
          if runs="$(gh api "repos/$REPO/actions/runs?event=merge_group&status=success&head_sha=$SHA&per_page=100")" &&
            count="$(jq --arg path "$path" '[.workflow_runs[] | select(.path == $path)] | length' <<< "$runs")"; then
            if [ "$count" -gt 0 ]; then passed=true; fi
          else
            echo "::warning::Could not read the merge queue runs for $SHA, so every job runs."
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "Merge queue proof for $path at $SHA: $passed"

  zizmor:
    name: zizmor (.github)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pinned, checksummed tool: the cached release download, else the
      # release download with retries, else a source that is not a GitHub
      # release (scripts/ci/install-pinned-tool.sh; docs/CI_RUNBOOK.md,
      # "What a job installs"). The cache key is the version and checksum.
      - name: Restore the pinned zizmor download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pubmax-tools/zizmor-1.30.1-e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
          key: pubmax-tool-zizmor-1.30.1-e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

      - name: Install zizmor
        env:
          TOOL_NAME: zizmor
          TOOL_VERSION: 1.30.1
          TOOL_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          TOOL_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
          TOOL_ARCHIVE: tar.gz
          TOOL_FALLBACK: pip
          TOOL_PIP_REQUIREMENT: "zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e"
        run: |
          scripts/ci/install-pinned-tool.sh
          zizmor --version

      # Online, so the audits that ask GitHub about each pinned action
      # (impostor commits, known-vulnerable actions, ref confusion) run too.
      # The job token is read-only and is passed to this step alone.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity low .github

  osv-scanner:
    name: osv-scanner (lockfiles)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pinned, checksummed tool: the cached release download, else the
      # release download with retries, else a source that is not a GitHub
      # release (scripts/ci/install-pinned-tool.sh; docs/CI_RUNBOOK.md,
      # "What a job installs"). The cache key is the version and checksum.
      - name: Restore the pinned osv-scanner download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pubmax-tools/osv-scanner-2.6.0-ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          key: pubmax-tool-osv-scanner-2.6.0-ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108

      - name: Install osv-scanner
        env:
          TOOL_NAME: osv-scanner
          TOOL_VERSION: 2.6.0
          TOOL_URL: https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          TOOL_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          TOOL_ARCHIVE: binary
          TOOL_FALLBACK: go
          TOOL_GO_MODULE: github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
        run: |
          scripts/ci/install-pinned-tool.sh
          osv-scanner --version

      # Recursive, so scripts/chatgpt-map, the iOS Package.resolved and any
      # lockfile added later are scanned without editing this line. It exits
      # non-zero when it finds no lockfile at all, so it cannot pass empty.
      - name: osv-scanner
        run: osv-scanner scan source --recursive .

  gitleaks:
    name: gitleaks (secrets)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, because a secret removed in a later commit is still
      # readable in the one that added it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pinned, checksummed tool: the cached release download, else the
      # release download with retries, else a source that is not a GitHub
      # release (scripts/ci/install-pinned-tool.sh; docs/CI_RUNBOOK.md,
      # "What a job installs"). The cache key is the version and checksum.
      - name: Restore the pinned gitleaks download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pubmax-tools/gitleaks-8.30.0-79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          key: pubmax-tool-gitleaks-8.30.0-79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e

      - name: Install gitleaks
        env:
          TOOL_NAME: gitleaks
          TOOL_VERSION: 8.30.0
          TOOL_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          TOOL_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          TOOL_ARCHIVE: tar.gz
          TOOL_FALLBACK: go
          TOOL_GO_MODULE: github.com/zricethezav/gitleaks/v8@v8.30.0
        run: |
          scripts/ci/install-pinned-tool.sh
          gitleaks version

      # --redact keeps a found value out of the job log. The allowlists and
      # their reasons are in .gitleaks.toml.
      # A PR scans its complete history. A push to main scans only the commits
      # that push added: with --all it also read every other branch, so a
      # finding on an unmerged branch turned main red on every push. When the
      # previous head is all zeros or missing from the clone, the push scans
      # the new head's complete history instead. The weekly and manual runs
      # still read every ref, so a secret on any branch is still found.
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|merge_group)
              log_opts="--full-history HEAD"
              ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                log_opts="--full-history $PUSH_AFTER"
              else
                log_opts="--full-history $PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
            *)
              log_opts="--full-history --all"
              ;;
          esac
          echo "gitleaks log range: $log_opts"
          gitleaks git --redact --verbose --no-banner --config .gitleaks.toml --log-opts="$log_opts" .

  semgrep:
    name: Semgrep CE (SAST)
    needs: [queue-proof]
    if: ${{ !cancelled() && needs.queue-proof.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          set -euo pipefail
          pipx install semgrep==1.179.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          semgrep --version

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/default \
            --metrics off \
            --severity ERROR \
            --error \
            --timeout 120 \
            --exclude node_modules \
            --exclude .next \
            --exclude public/data \
            --exclude uk_base/public/data \
            app lib components scripts proxy.ts next.config.mjs

  check:
    name: Security CI check
    if: ${{ always() }}
    needs: [queue-proof, zizmor, osv-scanner, gitleaks, semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          red="$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$red" ]; then
            echo "::error::Not green: $red"
            exit 1
          fi
