name: Security CI

# zizmor (workflow lint), osv-scanner (lockfile CVEs), Semgrep CE (SAST).
# Self-hosted pubmax-mac only; tools installed via Homebrew (docs/CI_RUNBOOK.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pubmax-mac-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor (workflows)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: zizmor
        run: zizmor --offline --min-severity high .github/workflows

  osv-scanner:
    name: osv-scanner (lockfile)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: osv-scanner
        run: osv-scanner scan --lockfile package-lock.json

  semgrep:
    name: Semgrep CE (SAST)
    runs-on: [self-hosted, pubmax-mac]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Semgrep
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
          SSL_CERT_FILE: /etc/ssl/cert.pem
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/default \
            --metrics off \
            --severity ERROR \
            --error \
            --timeout 120 \
            --exclude node_modules \
            --exclude .next \
            --exclude public/data \
            --exclude uk_base/public/data \
            app lib components scripts proxy.ts next.config.mjs
