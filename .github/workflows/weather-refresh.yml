name: Weather cache refresh

# KNOWN BLOCKER (wayfinder #389): dispatched and scheduled runs on this private
# repo currently end in `startup_failure` with zero jobs allocated — the run
# dies *before* any job starts. This is NOT a defect in this file: the YAML is
# valid (a manual dispatch resolves the workflow name and cron), and the minimal
# `ci.yml` workflow fails identically on workflow_dispatch. The cause is
# account-level GitHub Actions runner allocation — no hosted runner is granted
# for this private, user-owned repo (exhausted included minutes and/or a $0
# Actions spending limit). The fix is an OWNER action in account/repo settings
# (Settings > Billing and plans > raise the Actions spending limit above $0, or
# provision the already-installed Blacksmith runners and repoint `runs-on`).
# Editing this file cannot resolve it. Once runner allocation is fixed, dispatch
# this workflow and expect a green run.

on:
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weather-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify cache contract
        run: npm test -- __tests__/weatherSnapshots.test.ts
      - name: Configure review commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Refresh cache and open review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh:weather -- --open-pr
