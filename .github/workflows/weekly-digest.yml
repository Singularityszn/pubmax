name: Weekly digest

# DISABLED until an email provider is wired (Cycle 8 PRD item 2). The weekly
# cron below is intentionally commented out so this workflow never fires on a
# schedule while delivery is a no-op — enable it in the same change that lands
# RESEND_API_KEY + EMAIL_FROM (and the Supabase admin secrets). Follows the
# scripts/refresh_whats_on / weather-refresh idiom; manual dispatch stays
# available so the safe no-op can be exercised on demand.

on:
  # Enable the schedule when provider keys land. Monday 09:00 UTC.
  # schedule:
  #   - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    # This workflow does not run on pull_request, so a fork cannot read a
    # repository secret. See docs/CI_RUNBOOK.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
      - run: |
          npm ci
          npm run deps:install-scripts
      - name: Verify digest contract (generator + provider seam)
        run: npm test -- __tests__/weeklyDigest.test.ts __tests__/emailProvider.test.ts
      - name: Send weekly digest (safe no-op until keys land)
        env:
          # Absent ⇒ the script logs and exits 0 without sending.
          # SUPABASE_SERVICE_ROLE_KEY stays absent until delivery is wired.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/send_weekly_digest.mjs
