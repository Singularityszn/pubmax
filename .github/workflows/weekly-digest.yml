name: Weekly digest

# DISABLED until an email provider is wired (Cycle 8 PRD item 2). The weekly
# cron below is intentionally commented out so this workflow never fires on a
# schedule while delivery is a no-op — enable it in the same change that lands
# RESEND_API_KEY + EMAIL_FROM (and the Supabase admin secrets). Follows the
# scripts/refresh_whats_on / weather-refresh idiom; manual dispatch stays
# available so the safe no-op can be exercised on demand.

on:
  # Enable the schedule when provider keys land. Monday 09:00 UTC.
  # schedule:
  #   - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize pubmax-mac workflows on this ref only (repo-wide group blocked other branches).
  group: pubmax-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    # Jobs that hold a write token or a secret run on their own runner, as a
    # different macOS user from the one that runs pull request code. See
    # docs/CI_RUNBOOK.md, section 'Dedicated runner users'.
    runs-on: [self-hosted, pubmax-mac-refresh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse the console user
        run: bash scripts/ci/assert-runner-identity.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version: "22"
      - run: |
          npm ci
          npm run deps:install-scripts
      - name: Verify digest contract (generator + provider seam)
        run: npm test -- __tests__/weeklyDigest.test.ts __tests__/emailProvider.test.ts
      - name: Send weekly digest (safe no-op until keys land)
        env:
          # All optional today — absent ⇒ the script logs and exits 0 without
          # sending. Populate these secrets to activate delivery.
          # SUPABASE_SERVICE_ROLE_KEY is deliberately absent: no such secret
          # exists and delivery is not wired. Add it in the change that wires
          # delivery, and only while this job runs on the pubmax-mac-refresh
          # runner, never on the pull request runners.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/send_weekly_digest.mjs
