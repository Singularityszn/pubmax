name: Alert on scheduled failure

# A run nobody started by hand is the one nobody is watching, so a failure tells
# somebody. Two kinds qualify: a scheduled run, and a run started by a
# production deployment's `deployment_status` (Production smoke, API
# performance), which fires after a Git-integration deploy with nobody at the
# terminal. One workflow watches all of them through workflow_run, so the
# pull request workflows (Browser tests, Security CI) stay free of the secrets
# context, which __tests__/ciRunnerIsolation.test.ts holds. This workflow checks
# out nothing and runs no repository code: it only posts a link.
#
# The webhook is the PUBMAX_ALERT_WEBHOOK_URL repository secret, the same value
# the app reads as an environment variable (lib/alertSink.ts). Without it the
# job logs one line and passes. The URL is a credential: it is read only through
# the environment and never printed. A scheduled or deployment_status workflow
# added later must be named in `workflows` below; __tests__/alertSink.test.ts
# fails until it is. A Preview deployment status skips those workflows' jobs, and
# a skipped run is not a failure, so only a production run can post.
#
# Production uptime runs every five minutes, so it is also why this workflow
# shows a skipped run every five minutes. During an outage it posts once for
# each failed check, about every five minutes, until the site answers again.

on:
  workflow_run:
    workflows:
      - API performance
      - Browser tests
      - Drink price refresh
      - Performance
      - Production smoke
      - Production uptime
      - Security CI
      - Tavily London nightly
      - Weather cache refresh
    types: [completed]

permissions: {}

jobs:
  alert:
    name: Post to the alert webhook
    if: >-
      contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["schedule", "deployment_status"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALERT_WEBHOOK_URL: ${{ secrets.PUBMAX_ALERT_WEBHOOK_URL }}
      ALERT_TEXT: "[pubmax][ci] ${{ github.event.workflow_run.name }} failed: ${{ github.event.workflow_run.html_url }}"
    steps:
      - name: Post
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "No alert webhook is configured."
            exit 0
          fi
          jq -n --arg t "$ALERT_TEXT" '{content: $t, text: $t}' |
            curl -fsS --max-time 20 -X POST -H 'content-type: application/json' --data @- "$ALERT_WEBHOOK_URL" > /dev/null
