name: Night Signal candidate ingestion

# Arms EXA_API_KEY to fetch recent London pub buzz and stage PENDING candidates
# for review. It never publishes: the reviewed snapshot is produced by the
# separate "Night Signal refresh" workflow, and only after a human approves a
# candidate. Without the EXA_API_KEY secret the job is a safe no-op.
#
# KNOWN BLOCKER (wayfinder #389): dispatched and scheduled runs on this private
# repo currently end in `startup_failure` with zero jobs allocated — the run
# dies *before* any job starts. This is NOT a defect in this file: the YAML is
# valid, and the minimal `ci.yml` workflow fails identically on
# workflow_dispatch. The cause is account-level GitHub Actions runner allocation
# — no hosted runner is granted for this private, user-owned repo (exhausted
# included minutes and/or a $0 Actions spending limit). The fix is an OWNER
# action in account/repo settings (raise the Actions spending limit above $0, or
# provision the installed Blacksmith runners and repoint `runs-on`). Editing this
# file cannot resolve it. Once runner allocation is fixed, dispatch and expect a
# green run.

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: night-signal-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure review-bot identity
        run: |
          git config user.name "pubmax-signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
      - name: Verify ingestion normalisers
        run: npm test -- __tests__/exaSignalIngestion.test.ts
      - name: Fetch Exa buzz and open a candidate review PR
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ingest:night-signals -- --open-pr
