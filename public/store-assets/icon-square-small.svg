<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Small-size optics variant of icon-square.svg, used for exports at or under
    64px (iOS 20/29/40/58/60 slots). The Clink's arms are filled polygons, not
    strokes, so they never thin out at small raster tiers and need no thickening;
    but the r 3.2 ember lands under 3px at the 29px slot and would smear into the
    arm crossing, so this variant applies the canonical small-optics cut
    (docs/BRAND_MARK.md, #444 precedent; the same withNode:false cut
    gen-brand-assets.mjs stamps into the 16px favicon.ico member): the ember
    DROPS OUT and the arms carry the mark alone. Same polygons, same coral hex,
    same 0.82 tile inset as icon-square.svg, no glow (a gradient is mud at these
    sizes). Keep geometry in lockstep with icon-square.svg.
  -->
  <rect width="64" height="64" fill="#060607"/>
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <polygon points="19.8,8.7 10.2,17.3 46.0,53.7 52.0,48.3" fill="#ff5a5f"/>
    <polygon points="44.2,8.7 53.8,17.3 18.0,53.7 12.0,48.3" fill="#ff5a5f"/>
  </g>
</svg>
