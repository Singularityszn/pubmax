<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Small-size optics variant of icon-square.svg, used for exports at or under
    64px (iOS 20/29/40/58/60 slots). At 29px the canonical 8.5 stroke renders
    3.9px arms, readable, but the r 3.2 node lands under 3px and vanishes; this
    variant thickens the arms to 10.5 and grows the node to r 4.6 so the mark
    keeps its weight and its lit centre. Same endpoints, same hexes, no glow
    (a gradient is mud at these sizes). Keep geometry changes in lockstep with
    icon-square.svg.
  -->
  <rect width="64" height="64" fill="#060607"/>
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <path d="M18.5 18.5 L45.5 45.5" stroke="#ff5a5f" stroke-width="10.5" stroke-linecap="round"/>
    <path d="M45.5 18.5 L18.5 45.5" stroke="#ff5a5f" stroke-width="10.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4.6" fill="#ff7a55"/>
  </g>
</svg>
