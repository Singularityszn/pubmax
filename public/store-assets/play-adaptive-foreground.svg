<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <!--
    Play adaptive icon, foreground layer (issue #440): the coral Crossing on a
    transparent field, drawn on the 108dp adaptive canvas. Launchers show only
    the central 72dp and guarantee the central 66dp circle; at scale 1.1 the
    mark's farthest cap edge sits 25.7dp from centre, inside the 33dp safe
    radius, and the displayed mark spans ~54% of the visible icon, matching the
    iOS icon's optical weight. Keep this layer mark-only: the background layer
    carries the field, and the two shift independently under parallax.
  -->
  <g transform="translate(54 54) scale(1.1) translate(-32 -32)">
    <path d="M18.5 18.5 L45.5 45.5" stroke="#ff5a5f" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M45.5 18.5 L18.5 45.5" stroke="#ff5a5f" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="3.2" fill="#ff7a55"/>
  </g>
</svg>
