<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <!--
    Play adaptive icon, foreground layer (issue #440): the coral Clink on a
    transparent field, drawn on the 108dp adaptive canvas. Launchers show only
    the central 72dp and guarantee the central 66dp circle; at scale 1.1 the
    Clink's farthest mouth corner sits ~28.9dp from centre, inside the 33dp safe
    radius, with its lit ember node. Keep this layer mark-only: the background
    layer carries the field, and the two shift independently under parallax.
  -->
  <g transform="translate(54 54) scale(1.1) translate(-32 -32)">
    <polygon points="19.8,8.7 10.2,17.3 46.0,53.7 52.0,48.3" fill="#ff5a5f"/>
    <polygon points="44.2,8.7 53.8,17.3 18.0,53.7 12.0,48.3" fill="#ff5a5f"/>
    <circle cx="32" cy="32" r="3.2" fill="#ff7a55"/>
  </g>
</svg>
