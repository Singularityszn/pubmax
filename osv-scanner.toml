# osv-scanner (the "osv-scanner (lockfiles)" job in .github/workflows/security-ci.yml)
# reads this file. Each entry names one advisory, why it does not reach this
# repo, and the date it stops applying, so the job asks again then.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = """
minimatch globparts amplification. The fixed line (11.x) is in use through the
"minimatch@^10.0.0" override in package.json. What remains is minimatch 3.1.5,
nested under eslint-plugin-import, eslint-plugin-jsx-a11y and eslint-plugin-react
(dev only, already at their latest releases). Those plugins call minimatch 3 as a
function, which 11 does not export, and 3.1.5 has no firstPhasePreProcess or
optimizationLevel, the code the advisory names. Patterns come from this repo's
own lint config, never from a user. Remove this entry when the plugins move off
minimatch 3.
"""
