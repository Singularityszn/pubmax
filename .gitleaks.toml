# Secret scanning for the Security CI gitleaks job. The default rules stay on.
# Every allowance here matches a value, line, or rule-match shape, never a
# whole folder, so a real key pasted into a test, a fixture or a proof file
# still fails the job. A one-off match that fits no shape below is listed by
# its exact fingerprint (commit, file, rule and line) in .gitleaksignore, which
# never covers a later commit. Add an entry only with its reason, and never to
# silence a real credential: rotate it first.

[extend]
useDefault = true

# Late-food evidence card keys identify test records, not credentials.
[[allowlists]]
description = "Late-food evidence card keys are record identifiers."
condition = "AND"
regexTarget = "line"
regexes = ['''key:\s*"late-food-evidence-[a-z0-9-]+"''']

[[allowlists]]
description = "Source-freeze manifests under docs/proof list each file with its sha256, which the generic rule reads as a key. Only a quoted file name followed by a 64-character hex digest matches."
regexTarget = "line"
regexes = [
  '''"[^"\s]+\.[A-Za-z0-9]{1,6}":\s*"[0-9a-f]{64}"''',
  '''"tokenSHA256":\s*"[0-9a-f]{64}"''',
]

[[allowlists]]
description = "Checksums and doc prose that the generic rule reads as a key."
regexTarget = "line"
regexes = [
  '''OpenAPI SHA256:''',
  '''token, Plan/''',
]

[[allowlists]]
description = "Browser storage keys and route keys that start with the product name, and the named e2e placeholder publishable key."
regexTarget = "secret"
regexes = [
  '''^pubmaxx?[_:.-]''',
  '''^sb_publishable_pubmaxx_e2e''',
]

[[allowlists]]
description = "Test fixtures whose value names what it is: a Clerk test publishable key, an unsigned JWT ({} header), venue ids, and secrets spelled as words. A real credential does not start with these words."
regexTarget = "secret"
regexes = [
  '''^pk_test_''',
  '''^e30\.''',
  '''^header\.e30''',
  '''^venue-''',
  '''^(count|fixture)-''',
  '''^crew-(delivery|signing)''',
  '''^previous-''',
  '''^legacy-''',
  '''^route-''',
  '''^rt_(abc|legacy)''',
  '''^pm-guest-''',
  '''^pre-0125-''',
  '''^completion-''',
]

# OpenStreetMap tags a venue's LinkedIn page as contact:linkedin. A 16-letter
# handle such as "thejollybotanist" fits the linkedin-client-secret value
# shape, so a harvested OSM file read as a leak on every scan of history. All
# three conditions must hold: only that rule, only a file under data/osm/, and
# only a match whose key is the bare word linkedin (the rule's match starts
# after the "contact:" prefix). A linkedin_client_secret key, the same field
# outside data/osm/, and every other rule on the same line are still reported.
[[allowlists]]
description = "OpenStreetMap contact:linkedin handles in harvested data/osm files."
targetRules = ["linkedin-client-secret"]
condition = "AND"
paths = ['''^data/osm/''']
regexTarget = "match"
regexes = ['''^linkedin"\s*:\s*"[a-z0-9]{16}"$''']

[[allowlists]]
description = "The counting placeholder for a plan crew invite token in the Pal's Who's coming? tests. The crew link takes exactly 32 hex characters (isClassicPlanInviteToken), so it cannot carry a fixture- prefix. Only this one sequence matches, never another hex value."
regexTarget = "secret"
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
]
